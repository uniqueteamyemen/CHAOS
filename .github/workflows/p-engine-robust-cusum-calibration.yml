name: CHAOS P-engine robust CUSUM calibration

on:
  push:
    branches:
      - experiment/p-engine-parallel-fusion-v1
    paths:
      - "experiments/identity_lab/exp_p_engine_calibration/**"
      - ".github/workflows/p-engine-robust-cusum-calibration.yml"

permissions:
  contents: read

jobs:
  robust-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test confidence-bound calibration logic
        run: python -m unittest experiments.identity_lab.exp_p_engine_calibration.test_robust_cusum_calibration -v
      - name: Run paired 500-seed robust CUSUM calibration
        run: python -m experiments.identity_lab.exp_p_engine_calibration.robust_cusum_calibration
      - name: Upload robust CUSUM calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p-engine-robust-cusum-calibration
          path: experiments/identity_lab/exp_p_engine_calibration/results/robust_cusum_calibration.json
          if-no-files-found: warn
          retention-days: 90
