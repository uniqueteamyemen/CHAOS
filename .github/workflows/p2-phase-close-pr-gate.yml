name: CHAOS P2 — Phase Close Validation

on:
  pull_request:
    branches:
      - main-phase2
    paths:
      - 'real_data_stress_pipeline/**'
      - 'scripts/audits/**'
      - 'tests/audits/**'
      - 'tests/seismic_null_contract/**'
      - 'docs/P2_PHASE_CLOSE_STATUS_AR.md'
      - '.github/workflows/p2-phase-close-pr-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-p2-phase-close-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-and-contract:
    name: immutable-boundaries-and-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed phase-close commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen experiments and detector boundary
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/guards/check_experiments_immutable.py \
            --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --triple-dot

      - name: Run P2.2 pipeline and USGS catalog tests
        run: python -m unittest discover -s real_data_stress_pipeline/tests -p 'test_*.py' -v

      - name: Run Markov diagnostics, power, domain-null helper and routing tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/audits -p 'test_p2_2_*.py' -v
          python -m unittest discover -s tests/audits -p 'test_p2_null_eligibility.py' -v

      - name: Run seismic null-contract and declustering tests
        run: python -m unittest discover -s tests/seismic_null_contract -p 'test_*.py' -v

  real-data-and-domain-audits:
    name: bounded-live-data-and-domain-audit
    runs-on: ubuntu-latest
    needs: static-and-contract
    timeout-minutes: 180
    steps:
      - name: Checkout proposed phase-close commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Download and verify the immutable P2.2.1 source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chaos-p2-2-1-source"
          gh release download p2.2-historical-stress-v1.0.1 \
            --repo uniqueteamyemen/CHAOS \
            --pattern 'chaos-p2-2-source-snapshots.tar.gz*' \
            --dir "$RUNNER_TEMP/chaos-p2-2-1-source"
          cd "$RUNNER_TEMP/chaos-p2-2-1-source"
          sha256sum -c chaos-p2-2-source-snapshots.tar.gz.sha256
          tar -xzf chaos-p2-2-source-snapshots.tar.gz
          test -s real_data_stress_pipeline/results/real_data_stress_manifest.json

      - name: Run live P2.2 pipeline smoke with bounded resampling
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STRESS_BOOTSTRAP_REPLICATES: '19'
          STRESS_BOOTSTRAP_MEAN_BLOCK_MONTHS: '12'
          STRESS_BOOTSTRAP_MEAN_BLOCK_EVENTS: '25'
          STRESS_MIN_COMMODITY_POINTS: '501'
          STRESS_MIN_GEM_POINTS: '87'
          STRESS_USGS_MIN_MAGNITUDE: '4.5'
        run: python -u -m real_data_stress_pipeline.run_pipeline

      - name: Audit the generated per-series Markov manifest
        run: |
          python scripts/audits/p2_2_2_markov_diagnostics.py \
            real_data_stress_pipeline/results/real_data_stress_manifest.json \
            --output artifacts/markov_calibration_audit.json

      - name: Run bounded Markov real-series behavior audit
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/audits/p2_2_3_markov_real_data_behavior.py \
            --replicates 19 --max-series 5 --workers 2 \
            --output-dir artifacts/markov_real_data_behavior

      - name: Run bounded paired injected-break power audit
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/audits/p2_2_4_markov_injected_break_power.py \
            --replicates 9 --max-series 5 --workers 2 \
            --output-dir artifacts/markov_injected_break_power

      - name: Run seismic integrity, declustering and exploratory null audit
        env:
          PYTHONUNBUFFERED: '1'
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EIA_SERIES_IDS: ${{ vars.EIA_SERIES_IDS }}
          GEM_SNAPSHOT_DIR: ${{ runner.temp }}/chaos-p2-2-1-source
        run: |
          python -u scripts/audits/p2_2_3_domain_null_and_declustering.py \
            --poisson-replicates 200 \
            --gem-snapshot-dir "$GEM_SNAPSHOT_DIR" \
            --output-dir artifacts/domain_null_and_declustering

      - name: Upload complete P2 phase-close audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-phase-close-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            real_data_stress_pipeline/results/
            artifacts/markov_calibration_audit.json
            artifacts/markov_real_data_behavior/
            artifacts/markov_injected_break_power/
            artifacts/domain_null_and_declustering/
            artifacts/real_data_stress/
          if-no-files-found: warn
          retention-days: 90
