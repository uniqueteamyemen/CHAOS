name: CHAOS P1.4 C1 Arm-Isolated Pilot (reuse Run 45707752707)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-p1-4-c1-arm-isolated
  cancel-in-progress: false

jobs:
  arm-isolated-c1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned C1 Pilot runtime
        run: |
          python -m pip install "numpy==1.26.4" "pandas==2.2.3"
          python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Compile and test the arm-isolated contract
        run: |
          set -euo pipefail
          python -m py_compile p1_4_validation/run_arm_isolated_pilot.py p1_4_validation/run_evidence_pipeline.py
          python -m unittest discover -s tests/governance -p 'test_p1_4_arm_isolated_pilot.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_capability_envelope.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_pilot_protocol.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_injection_runner.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_cohort_selection_manifest_binding.py' -v
      - name: Download and verify frozen P2-C inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p2-g1-shards /tmp/p1-4-calibration-source
          fetch_artifact() {
            local artifact_id="$1" digest="$2" output="$3"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o "$output"
            echo "$digest  $output" | sha256sum --check
          }
          fetch_artifact 14857826243 c83f6e960296fbbdb687650a798959f08cb8d98db68de8ca713d7be278e824fe /tmp/p2-prepared.zip
          fetch_artifact 14995009654 fa67b9c79e5867a0d799c981903e3a44b9b7b680bb2a844a25dfd2a91bf31e0b /tmp/cohort-selection.zip
          unzip -p /tmp/cohort-selection.zip cohort_selection.json > /tmp/cohort_selection.json
          echo "9ad27e0c78e3d851ec9f2c02828eadc15567f84fc1ed8f467588bb7d4f42288b  /tmp/cohort_selection.json" | sha256sum --check
          fetch_artifact 14861808748 6cf04825de2a5e7f6b30f03aad97426fa0392038e84764ee68b52e2f70d5f89c /tmp/g1-0.zip
          fetch_artifact 14861805478 6f617b240c3c35d68f0295a9e21ebf07e797ff72d3566b984b764491b925c886 /tmp/g1-1.zip
          fetch_artifact 14862282819 881c40e34838329c1b809257d9c729c56e5304ab20b015bf8b98f656075586d4 /tmp/g1-2.zip
          fetch_artifact 14860330825 6996d69724f01b1be7ba1660ecc1572e4432802f1aebc21d521e22b58e5a35df /tmp/g1-3.zip
          unzip -p /tmp/g1-0.zip shard-0.json > /tmp/p2-g1-shards/shard-0.json
          unzip -p /tmp/g1-1.zip shard-1.json > /tmp/p2-g1-shards/shard-1.json
          unzip -p /tmp/g1-2.zip shard-2.json > /tmp/p2-g1-shards/shard-2.json
          unzip -p /tmp/g1-3.zip shard-3.json > /tmp/p2-g1-shards/shard-3.json
      - name: Download exact C1 calibration artifacts from Run 45707752707
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python p1_4_validation/run_arm_isolated_pilot.py \
            --download-calibration-artifacts \
            --artifact-manifest p1_4_validation/c1_calibration_artifacts_run_45707752707.json \
            --artifact-dir /tmp/p1-4-calibration-source
      - name: Run C1 arm-isolated Huber scale variants (no recalibration)
        run: |
          set -euo pipefail
          python p1_4_validation/run_arm_isolated_pilot.py \
            --prepared-zip /tmp/p2-prepared.zip \
            --manifest p1_4_validation/cohort_manifest.json \
            --protocol p1_4_validation/pilot_protocol.json \
            --selection-json /tmp/cohort_selection.json \
            --g1-shards-dir /tmp/p2-g1-shards \
            --artifact-manifest p1_4_validation/c1_calibration_artifacts_run_45707752707.json \
            --artifact-dir /tmp/p1-4-calibration-source \
            --output artifacts/p1_4/arm_isolated_c1
      - name: Upload arm-isolated C1 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p1-4-c1-arm-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: artifacts/p1_4/arm_isolated_c1/
