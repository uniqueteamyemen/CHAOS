name: CHAOS B-v3.2 Minimal Calibration Retest

on:
  push:
    branches:
      - experiment/b3-1-minimal-calibration-retest
    paths:
      - "experiments/identity_lab/exp_sequential_break_b3_2_retest/**"
      - ".github/workflows/sequential-break-engine-b3-2-minimal-retest.yml"

permissions:
  contents: read

jobs:
  minimal-calibration-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Run isolated B-v3.2 minimal-change tests
        run: python -m unittest experiments.identity_lab.exp_sequential_break_b3_2_retest.test_b3_2_retest -v
      - name: Run eight-case paired development and holdout retest
        run: python -m experiments.identity_lab.exp_sequential_break_b3_2_retest.benchmark_b3_2_retest --dev-trials 500 --holdout-trials 500
      - name: Upload full calibration and paired B-v3.1 comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-b3-2-minimal-calibration-retest
          path: experiments/identity_lab/exp_sequential_break_b3_2_retest/results/sequential_break_engine_b3_2_minimal_retest.json
          if-no-files-found: error
          retention-days: 90
