name: CHAOS P2-C — Independent Detector Competition

on:
  pull_request:
    branches: [main-phase2]
    paths:
      - "p2_b_benchmark/p2c_engine.py"
      - "p2_b_benchmark/p2c_run.py"
      - "p2_b_benchmark/tests/test_p2c_*.py"
      - "p2_b_benchmark/vendor/robseg_lgpl/**"
      - "p2_b_benchmark/SHA256SUMS.txt"
      - ".github/workflows/p2-c-economic-competition.yml"
      - ".github/workflows/p2-c-synthetic-stress.yml"
      - ".github/workflows/p2-b-detector-competition.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-p2-c-economic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p2c-shard:
    name: P2-C shard ${{ matrix.shard }} / 4
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce experiments archive immutability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/guards/check_experiments_immutable.py --base "$BASE_SHA" --head "$GITHUB_SHA"
      - name: Verify frozen BreakDetectorV1 source blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:structural_engine/isolated_break_detector_v1/__init__.py)" = "fb7b305c6ec089ff1b120b3e821e10c60c042623"
          test "$(git rev-parse HEAD:structural_engine/isolated_break_detector_v1/break_detector_v1.py)" = "10426c108b9786b7a565ba1796b943b6d44ee130"
          test "$(git rev-parse HEAD:structural_engine/isolated_break_detector_v1/engine_fast_ref.py)" = "a19269d1c6a65f55548bbe01b0d2bb2ca27c6834"
          test "$(git rev-parse HEAD:structural_engine/isolated_break_detector_v1/engine_markov_cusum.py)" = "9ca9bcd3adbc97a1aa296708d929d64fd0e3e81c"
      - name: Verify complete benchmark checksums
        run: sha256sum --check p2_b_benchmark/SHA256SUMS.txt
      - name: Install runtime dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Re-run preserved P2-B contract suite
        run: python -m unittest p2_b_benchmark.tests.test_core -v
      - name: Run P2-C synthetic stress and algorithm reference gates
        run: |
          python -m unittest p2_b_benchmark.tests.test_p2c_stress -v
          python -m unittest p2_b_benchmark.tests.test_p2c_aggregation -v
      - name: Download pinned P2.2 prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14857826243/zip \
            -o /tmp/chaos-p2-prepared-45244943216.zip
          echo "c83f6e960296fbbdb687650a798959f08cb8d98db68de8ca713d7be278e824fe  /tmp/chaos-p2-prepared-45244943216.zip" | sha256sum --check
      - name: Run assigned P2-C economic shard
        run: |
          set -euo pipefail
          python -u -m p2_b_benchmark.p2c_run \
            --prepared-zip /tmp/chaos-p2-prepared-45244943216.zip \
            --null-replicates 99 \
            --workers 4 \
            --shard-index "${{ matrix.shard }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output-dir artifacts/p2_c_shards
      - name: Upload shard metrics (no raw observations)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-c-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: warn
          path: artifacts/p2_c_shards/p2c_shard_${{ matrix.shard }}_of_4.json

  p2c-aggregate:
    name: Aggregate and validate P2-C cohort
    needs: p2c-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install aggregation dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Download shard artifacts from this run attempt
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: chaos-p2-c-shard-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: artifacts/p2_c_shards
          merge-multiple: true
      - name: Aggregate and validate exact 509-series coverage
        id: aggregate
        if: always()
        run: |
          python -u -m p2_b_benchmark.p2c_run \
            --aggregate-shards artifacts/p2_c_shards \
            --output-dir artifacts/p2_c
      - name: Upload final metrics and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-c-economic-competition-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            artifacts/p2_c/P2_C_DETECTOR_COMPETITION_V1.json
            artifacts/p2_c/P2_C_DETECTOR_COMPETITION_V1_AR.md
      - name: Publish report summary
        if: always()
        run: |
          if [[ -s artifacts/p2_c/P2_C_DETECTOR_COMPETITION_V1_AR.md ]]; then
            cat artifacts/p2_c/P2_C_DETECTOR_COMPETITION_V1_AR.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No final P2-C report; inspect shard and aggregate logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce P2-C causal and coverage gates
        if: ${{ needs.p2c-shard.result == 'success' && steps.aggregate.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/p2_c/P2_C_DETECTOR_COMPETITION_V1.json").read_text(encoding="utf-8"))
          failures = {
              arm: row["all"]["prefix_replay_or_mutation_violations"]
              for arm, row in report["summary"]["causal"].items()
              if row["all"]["prefix_replay_or_mutation_violations"] > 0
          }
          unverifiable = {
              arm: row["all"]["unverifiable_short_prefix_events"]
              for arm, row in report["summary"]["causal"].items()
              if row["all"]["unverifiable_short_prefix_events"] > 0
          }
          print(json.dumps({"causal_failures": failures,
                            "unverifiable_prefixes": unverifiable,
                            "series": report["source_integrity"]["series"],
                            "cohort": report["source_integrity"]}, indent=2))
          if report["source_integrity"]["series"] != 509:
              raise SystemExit("P2C_SERIES_COVERAGE_GATE_FAILED")
          if failures:
              raise SystemExit("P2C_CAUSAL_REPLAY_GATE_FAILED")
          if unverifiable:
              raise SystemExit("P2C_CAUSAL_REPLAY_UNVERIFIABLE")
          PY
