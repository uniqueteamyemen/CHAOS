name: CHAOS P2.2.3 — Domain Null and Seismic Declustering

on:
  push:
    branches:
      - diag/domain-null-and-declustering
    paths:
      - 'real_data_stress_pipeline/diagnostics/**'
      - 'real_data_stress_pipeline/contracts/seismic_declustering_contract_v1.json'
      - 'scripts/audits/p2_2_3_domain_null_and_declustering.py'
      - 'tests/seismic_null_contract/**'
      - 'tests/audits/test_p2_2_3_domain_null_audit_helpers.py'
  workflow_dispatch:
    inputs:
      poisson_replicates:
        description: 'Rate-matched homogeneous Poisson benchmark replicates'
        required: false
        default: '200'

permissions:
  contents: read

concurrency:
  group: chaos-p2-2-3-domain-null-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-and-unit-tests:
    name: seismic-declustering-and-domain-null-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated domain branch
        uses: actions/checkout@v4
        with:
          ref: diag/domain-null-and-declustering
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.11-pip-${{ hashFiles('real_data_stress_pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-pip-
      - name: Install pipeline requirements
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Test seismic contracts and Gardner-Knopoff
        run: python -m unittest discover -s tests/seismic_null_contract -p 'test_*.py' -v
      - name: Test domain audit helpers and API credential handling
        run: python -m unittest discover -s tests/audits -p 'test_p2_2_3_domain_null_audit_helpers.py' -v

  domain-audit:
    name: usgs-declustering-poisson-and-economic-source-audit
    runs-on: ubuntu-latest
    needs: contract-and-unit-tests
    timeout-minutes: 60
    steps:
      - name: Checkout isolated domain branch
        uses: actions/checkout@v4
        with:
          ref: diag/domain-null-and-declustering
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.11-pip-${{ hashFiles('real_data_stress_pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-pip-
      - name: Install pipeline requirements
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Run domain null and declustering audit
        env:
          PYTHONUNBUFFERED: '1'
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EIA_SERIES_IDS: ${{ vars.EIA_SERIES_IDS }}
          POISSON_REPLICATES: ${{ inputs.poisson_replicates || '200' }}
        run: |
          python -u scripts/audits/p2_2_3_domain_null_and_declustering.py \
            --poisson-replicates "$POISSON_REPLICATES" \
            --output-dir artifacts/domain_null_and_declustering
      - name: Upload domain audit outputs and preserved labeled catalogs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-2-3-domain-null-and-declustering
          path: |
            artifacts/domain_null_and_declustering/
            artifacts/real_data_stress/raw/
            artifacts/real_data_stress/derived/
          if-no-files-found: warn
          retention-days: 90
