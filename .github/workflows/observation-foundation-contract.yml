name: CHAOS — Observation Foundation Contract

on:
  pull_request:
    branches:
      - main-phase2
    paths:
      - 'observation_foundation/**'
      - 'tests/observation_foundation/**'
      - 'chaos_governance_kernel/core.py'
      - 'experimental_contracts/RESEARCH_LEDGER_CONTRACT_V1.json'
      - '.github/workflows/observation-foundation-contract.yml'
  push:
    branches:
      - main-phase2
      - fix/p2-2-3-gem-snapshot
      - 'discovery/**'
    paths:
      - 'observation_foundation/**'
      - 'tests/observation_foundation/**'
      - 'chaos_governance_kernel/core.py'
      - 'experimental_contracts/RESEARCH_LEDGER_CONTRACT_V1.json'
      - '.github/workflows/observation-foundation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-foundation-tests:
    name: source-record-identity-v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile identity, lifecycle and governance utilities
        run: python -m py_compile observation_foundation/record_identity_v1.py observation_foundation/lifecycle_v1.py chaos_governance_kernel/core.py
      - name: Validate source observation contract JSON
        run: python -m json.tool observation_foundation/contracts/source_record_observation_v1.schema.json
      - name: Validate hypothesis lifecycle contract JSON
        run: python -m json.tool observation_foundation/contracts/hypothesis_lifecycle_v1.schema.json
      - name: Validate input disposition contract JSON
        run: python -m json.tool observation_foundation/contracts/input_disposition_v1.schema.json
      - name: Validate Research Ledger contract JSON
        run: python -m json.tool experimental_contracts/RESEARCH_LEDGER_CONTRACT_V1.json
      - name: Run deterministic identity and lifecycle tests
        run: python -m unittest discover -s tests/observation_foundation -v
