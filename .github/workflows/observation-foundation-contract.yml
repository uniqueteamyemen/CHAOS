name: CHAOS — Observation Foundation Contract

on:
  push:
    branches:
      - fix/p2-2-3-gem-snapshot
    paths:
      - 'observation_foundation/**'
      - 'tests/observation_foundation/**'
      - '.github/workflows/observation-foundation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-foundation-tests:
    name: source-record-identity-v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout active working branch
        uses: actions/checkout@v4
        with:
          ref: fix/p2-2-3-gem-snapshot
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile identity utility
        run: python -m py_compile observation_foundation/record_identity_v1.py
      - name: Validate contract JSON syntax
        run: python -m json.tool observation_foundation/contracts/source_record_observation_v1.schema.json
      - name: Run deterministic identity and vintage tests
        run: python -m unittest discover -s tests/observation_foundation -v
