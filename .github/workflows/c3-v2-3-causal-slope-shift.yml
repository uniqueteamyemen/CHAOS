name: CHAOS C3 v2.3 — Causal Local Slope-Shift

on:
  push:
    branches: [experiment/c3-v2-3-calibration-slope-shift-v1]
    paths:
      - '.github/workflows/c3-v2-3-causal-slope-shift.yml'
      - 'p1_4_validation/c3/causal_local_slope_shift.py'
      - 'p1_4_validation/c3/c3_v2_3_slope_shift_calibration.py'
      - 'p1_4_validation/c3/c3_v2_3_slope_shift_replay.py'
      - 'p1_4_validation/c3/c3_v2_3_slope_shift_series.py'
      - 'p1_4_validation/c3/run_c3_v2_3_slope_shift.py'
      - 'p1_4_validation/c3/prepare_c3_v2_3_source.py'
      - 'p1_4_validation/c3/summarize_c3_v2_3_report.py'
      - 'p1_4_validation/c3/c3_v2_3_slope_shift_preregistration.json'
      - 'tests/governance/test_c3_v2_3_causal_local_slope_shift.py'
      - 'tests/governance/test_c3_v2_3_slope_shift_calibration.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-c3-v2-3-slope-shift-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SOURCE_INTAKE_RUN_ID: '45757611871'
      SOURCE_ARTIFACT_ID: '15088960800'
      SOURCE_ARTIFACT_NAME: chaos-c3-v2-expanded-source-intake-45757611871-1
      SOURCE_ARTIFACT_SHA256: e9760015cad58c96171fb45c486345b8a4ded64f9c5379b59192e435366c45d3
      SOURCE_TAPE_SHA256: f81a4e802e62ff5effaeae2240d1f3835d2e3650037887cdea4aaf79816959c1
      EVALUATION_CONTRACT_SHA256: 0da3b68ead082157eb586dd1952afc3f7006dc85bbc7edf2ef1e702951360d49
      PREREGISTERED_PROTOCOL_SHA256: 4cf9d4753946c9425c2aba2656481ee73934f7c68e67c94dcb55daf767a4136a
    steps:
      - name: Enforce isolated branch and frozen inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/c3-v2-3-calibration-slope-shift-v1
          test "$SOURCE_INTAKE_RUN_ID" = 45757611871
          test "$SOURCE_ARTIFACT_ID" = 15088960800
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Verify exact existing GitHub artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > /tmp/source.json
          python -c 'import json,os; a=json.load(open("/tmp/source.json")); assert a["id"]==int(os.environ["SOURCE_ARTIFACT_ID"]); assert a["name"]==os.environ["SOURCE_ARTIFACT_NAME"]; assert a["digest"]=="sha256:"+os.environ["SOURCE_ARTIFACT_SHA256"]; assert a["expired"] is False; assert int(a["workflow_run"]["id"])==int(os.environ["SOURCE_INTAKE_RUN_ID"]); print("FROZEN_SOURCE_ARTIFACT_METADATA_VERIFIED")'
      - name: Download exact frozen source intake
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_INTAKE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/c3-v2-3-source
      - name: Verify manifest and create deterministic source archive
        run: python p1_4_validation/c3/prepare_c3_v2_3_source.py
      - name: Verify frozen preregistration digest
        run: echo "$PREREGISTERED_PROTOCOL_SHA256  p1_4_validation/c3/c3_v2_3_slope_shift_preregistration.json" | sha256sum -c -
      - name: Compile experiment code and tests
        run: |
          python -m py_compile \
            p1_4_validation/c3/causal_local_slope_shift.py \
            p1_4_validation/c3/c3_v2_3_slope_shift_calibration.py \
            p1_4_validation/c3/c3_v2_3_slope_shift_replay.py \
            p1_4_validation/c3/c3_v2_3_slope_shift_series.py \
            p1_4_validation/c3/run_c3_v2_3_slope_shift.py \
            p1_4_validation/c3/prepare_c3_v2_3_source.py \
            p1_4_validation/c3/summarize_c3_v2_3_report.py \
            tests/governance/test_c3_v2_3_causal_local_slope_shift.py \
            tests/governance/test_c3_v2_3_slope_shift_calibration.py
      - name: Run focused governance tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests/governance -p 'test_c3_v2_3_*.py' -v
      - name: Execute 2,000 Development + 2,000 independent Holdout per target series
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -u p1_4_validation/c3/run_c3_v2_3_slope_shift.py \
            --source-zip /tmp/c3-v2-3-frozen-source.zip \
            --contract p1_4_validation/c3/c3_expanded_event_cohort_v2_2.json \
            --protocol p1_4_validation/c3/c3_v2_3_slope_shift_preregistration.json \
            --expected-source-run-id "$SOURCE_INTAKE_RUN_ID" --replicates 2000 \
            --output-dir artifacts/p1_4/c3/v2_3_causal_slope_shift
      - name: Publish compact result summary
        if: always()
        run: python p1_4_validation/c3/summarize_c3_v2_3_report.py
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-c3-v2-3-slope-shift-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p1_4/c3/v2_3_causal_slope_shift/
          retention-days: 90
          if-no-files-found: warn
