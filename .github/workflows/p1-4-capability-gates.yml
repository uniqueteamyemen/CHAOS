name: CHAOS P1.4 Capability Contract Gates

on:
  push:
    branches:
      - feat/p1-4-capability-envelope-pilot-v1-20261125
    paths:
      - "chaos_governance_kernel/capability_envelope.py"
      - "p1_4_validation/capability_envelope.json"
      - "p1_4_validation/capability_envelope.schema.json"
      - "p1_4_validation/cohort_manifest.json"
      - "p1_4_validation/pilot_protocol.json"
      - "p1_4_validation/pilot_protocol.schema.json"
      - "tests/governance/test_p1_4_pilot_protocol.py"
      - "tests/governance/test_p1_4_injection_runner.py"
      - "tests/governance/test_p1_4_capability_envelope.py"
      - "tests/governance/test_p1_4_injection_runner.py"
      - ".github/workflows/p1-4-capability-gates.yml"
  pull_request:
    branches: [main-phase2]
    paths:
      - "chaos_governance_kernel/capability_envelope.py"
      - "p1_4_validation/**"
      - "tests/governance/test_p1_4_pilot_protocol.py"
      - "tests/governance/test_p1_4_capability_envelope.py"
      - ".github/workflows/p1-4-capability-gates.yml"

permissions:
  contents: read

concurrency:
  group: chaos-p1-4-capability-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile capability runtime
        run: python -m py_compile chaos_governance_kernel/capability_envelope.py
      - name: Install P1.4 injection runtime dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Run P1.4 capability, protocol and injection contract tests
        run: |
          python -m unittest discover -s tests/governance -p 'test_p1_4_capability_envelope.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_pilot_protocol.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_injection_runner.py' -v
