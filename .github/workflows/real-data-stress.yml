name: CHAOS P2.2 — Automated Historical Sensor Stress Validation

on:
  push:
    branches:
      - main-phase2
    paths:
      - 'real_data_stress_pipeline/**'
      - '!real_data_stress_pipeline/results/**'
      - 'structural_engine/isolated_break_detector_v1/**.py'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'COPYRIGHT_AND_IP_NOTICE.md'
      - 'DATA_SOURCES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/real-data-stress.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chaos-p2-2-stress-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout phase2 branch with history
        uses: actions/checkout@v4
        with:
          ref: main-phase2
          fetch-depth: 0

      - name: Create and publish the immutable Phase 1 annotated tag and release
        env:
          GH_TOKEN: \${{ github.token }}
          BASELINE_SHA: 51e4278309b7d32917b85903323a63f81d9e9b6a
          TAG_NAME: phase1-detector-freeze-v1.0
        run: |
          set -euo pipefail
          git config user.name "uniqueteamyemen"
          git config user.email "uniqueteamyemen@gmail.com"
          git cat-file -e "\${BASELINE_SHA}^{commit}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/\${TAG_NAME}" >/dev/null 2>&1; then
            git tag -a "\${TAG_NAME}" "\${BASELINE_SHA}" \
              -m "CHAOS Phase 1 frozen detector archive; canonical commit \${BASELINE_SHA}"
            git push origin "refs/tags/\${TAG_NAME}"
          else
            existing="$(git ls-remote origin "refs/tags/\${TAG_NAME}^{}" | awk '{print $1}')"
            if [ -z "\${existing}" ]; then
              existing="$(git ls-remote origin "refs/tags/\${TAG_NAME}" | awk '{print $1}')"
            fi
            if [ "\${existing}" != "\${BASELINE_SHA}" ]; then
              echo "Existing Phase 1 tag points to a different commit: \${existing}" >&2
              exit 1
            fi
          fi
          if ! gh release view "\${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "\${TAG_NAME}" \
              --target "\${BASELINE_SHA}" \
              --title "CHAOS Phase 1 — Frozen Detector Archive" \
              --notes-file docs/PHASE1_DETECTOR_FREEZE.md
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify historical experiments archive is unchanged
        env:
          BEFORE_SHA: \${{ github.event.before }}
          CURRENT_SHA: \${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "\${BEFORE_SHA}" ] && [ "\${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            python scripts/guards/check_experiments_immutable.py \
              --base "\${BEFORE_SHA}" \
              --head "\${CURRENT_SHA}"
          fi

      - name: Run pipeline contract tests
        run: python -m unittest discover -s real_data_stress_pipeline/tests -v

      - name: Execute real historical stress pipeline
        env:
          GITHUB_SHA: \${{ github.sha }}
          STRESS_BOOTSTRAP_REPLICATES: '199'
          STRESS_BOOTSTRAP_MEAN_BLOCK_MONTHS: '12'
          STRESS_BOOTSTRAP_MEAN_BLOCK_EVENTS: '25'
          STRESS_MIN_COMMODITY_POINTS: '501'
          STRESS_MIN_GEM_POINTS: '87'
          STRESS_USGS_MIN_MAGNITUDE: '4.5'
        run: python -m real_data_stress_pipeline.run_pipeline

      - name: Upload raw source responses and complete numerical audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-2-stress-\${{ github.run_id }}-\${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            artifacts/real_data_stress/raw/
            artifacts/real_data_stress/derived/
            REAL_DATA_STRESS_REPORT_AR.md
            real_data_stress_pipeline/results/

      - name: Commit report, manifest, and checksum inventory
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REAL_DATA_STRESS_REPORT_AR.md real_data_stress_pipeline/results/
          if ! git diff --cached --quiet; then
            git commit -m "data(chaos): archive P2.2 real-data stress results"
            git push origin HEAD:main-phase2
          fi

      - name: Create and publish the P2.2 annotated tag and release
        if: success()
        env:
          GH_TOKEN: \${{ github.token }}
          TAG_NAME: p2.2-historical-stress-v1.0.0
        run: |
          set -euo pipefail
          git fetch origin main-phase2
          git checkout -B main-phase2 origin/main-phase2
          TAG_SHA="$(git rev-parse HEAD)"
          if ! git ls-remote --exit-code --tags origin "refs/tags/\${TAG_NAME}" >/dev/null 2>&1; then
            git tag -a "\${TAG_NAME}" "\${TAG_SHA}" \
              -m "CHAOS P2.2 historical sensor stress validation v1.0.0; commit \${TAG_SHA}"
            git push origin "refs/tags/\${TAG_NAME}"
          else
            existing="$(git ls-remote origin "refs/tags/\${TAG_NAME}^{}" | awk '{print $1}')"
            if [ -z "\${existing}" ]; then
              existing="$(git ls-remote origin "refs/tags/\${TAG_NAME}" | awk '{print $1}')"
            fi
            if [ "\${existing}" != "\${TAG_SHA}" ]; then
              echo "Existing P2.2 tag points to a different commit: \${existing}" >&2
              exit 1
            fi
          fi
          if ! gh release view "\${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "\${TAG_NAME}" \
              --target "\${TAG_SHA}" \
              --title "CHAOS P2.2 — Automated Historical Sensor Stress Validation v1.0.0" \
              --notes-file REAL_DATA_STRESS_REPORT_AR.md \
              REAL_DATA_STRESS_REPORT_AR.md \
              real_data_stress_pipeline/results/real_data_stress_manifest.json \
              real_data_stress_pipeline/results/SHA256SUMS.txt
          fi
