name: CHAOS P2.2 — Automated Historical Sensor Stress Validation

on:
  pull_request:
    branches:
      - main-phase2
      - p2/phase-close-v1
  push:
    branches:
      - main-phase2
    paths:
      - 'real_data_stress_pipeline/**'
      - '!real_data_stress_pipeline/results/**'
      - 'structural_engine/isolated_break_detector_v1/**.py'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'COPYRIGHT_AND_IP_NOTICE.md'
      - 'DATA_SOURCES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/real-data-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-p2-2-stress-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main-phase2')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout phase2 branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create and publish the Phase 1 annotated tag and release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: 51e4278309b7d32917b85903323a63f81d9e9b6a
          TAG_NAME: phase1-detector-freeze-v1.0
        run: |
          set -euo pipefail
          git config user.name "uniqueteamyemen"
          git config user.email "uniqueteamyemen@gmail.com"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            git tag -a "${TAG_NAME}" "${BASELINE_SHA}" \
              -m "CHAOS Phase 1 frozen detector archive; canonical commit ${BASELINE_SHA}"
            git push origin "refs/tags/${TAG_NAME}"
          else
            existing="$(git ls-remote origin "refs/tags/${TAG_NAME}^{}" | awk '{print $1}')"
            if [ -z "${existing}" ]; then
              existing="$(git ls-remote origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
            fi
            if [ "${existing}" != "${BASELINE_SHA}" ]; then
              echo "Existing Phase 1 tag points to a different commit: ${existing}" >&2
              exit 1
            fi
          fi
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --target "${BASELINE_SHA}" \
              --title "CHAOS Phase 1 — Frozen Detector Archive" \
              --notes-file docs/PHASE1_DETECTOR_FREEZE.md
          fi
          mkdir -p /tmp/chaos-phase1-release
          git show "${BASELINE_SHA}:docs/PHASE1_DETECTOR_FREEZE.md" > /tmp/chaos-phase1-release/PHASE1_DETECTOR_FREEZE.md
          git show "${BASELINE_SHA}:structural_engine/isolated_break_detector_v1/results/real_data_transition_scan.json" > /tmp/chaos-phase1-release/real_data_transition_scan.json
          git show "${BASELINE_SHA}:structural_engine/isolated_break_detector_v1/results/SHA256SUMS.txt" > /tmp/chaos-phase1-release/SHA256SUMS.txt
          gh release upload "${TAG_NAME}" \
            /tmp/chaos-phase1-release/PHASE1_DETECTOR_FREEZE.md \
            /tmp/chaos-phase1-release/real_data_transition_scan.json \
            /tmp/chaos-phase1-release/SHA256SUMS.txt \
            --clobber

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify both frozen archives are unchanged
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python scripts/guards/check_experiments_immutable.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --triple-dot
          elif [[ -n "$PUSH_BASE_SHA" && "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            python scripts/guards/check_experiments_immutable.py --base "$PUSH_BASE_SHA" --head "$PUSH_HEAD_SHA"
          fi

      - name: Run pipeline contract tests
        run: python -m unittest discover -s real_data_stress_pipeline/tests -p 'test_*.py' -v

      - name: Run Markov, null-routing and seismic contract tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/audits -p 'test_p2_2_*.py' -v
          python -m unittest discover -s tests/audits -p 'test_p2_codex_polish.py' -v
          python -m unittest discover -s tests/audits -p 'test_p2_null_eligibility.py' -v
          python -m unittest discover -s tests/seismic_null_contract -p 'test_*.py' -v

      - name: Execute real historical stress pipeline
        if: github.event_name != 'pull_request'
        env:
          GITHUB_SHA: ${{ github.sha }}
          STRESS_BOOTSTRAP_REPLICATES: '999'
          STRESS_BOOTSTRAP_MEAN_BLOCK_MONTHS: '12'
          STRESS_BOOTSTRAP_MEAN_BLOCK_EVENTS: '25'
          STRESS_MIN_COMMODITY_POINTS: '501'
          STRESS_MIN_GEM_POINTS: '87'
          STRESS_USGS_MIN_MAGNITUDE: '4.5'
        run: python -u -m real_data_stress_pipeline.run_pipeline

      - name: Audit generated P2.2 Markov manifest
        if: github.event_name != 'pull_request'
        run: |
          python scripts/audits/p2_2_2_markov_diagnostics.py \
            real_data_stress_pipeline/results/real_data_stress_manifest.json \
            --output artifacts/markov_calibration_audit.json

      - name: Run bounded Markov real-series behavior audit
        if: github.event_name != 'pull_request'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/audits/p2_2_3_markov_real_data_behavior.py \
            --replicates 999 --workers 2 \
            --output-dir artifacts/markov_real_data_behavior

      - name: Run bounded paired injected-break power audit
        if: github.event_name != 'pull_request'
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/audits/p2_2_4_markov_injected_break_power.py \
            --replicates 999 --workers 2 \
            --output-dir artifacts/markov_injected_break_power

      - name: Run full seismic integrity, declustering and exploratory null audit
        env:
          PYTHONUNBUFFERED: '1'
          FRED_API_KEY: ${{ github.ref == 'refs/heads/main-phase2' && secrets.FRED_API_KEY || '' }}
          EIA_API_KEY: ${{ github.ref == 'refs/heads/main-phase2' && secrets.EIA_API_KEY || '' }}
          EIA_SERIES_IDS: ${{ vars.EIA_SERIES_IDS }}
        run: |
          python -u scripts/audits/p2_2_3_domain_null_and_declustering.py \
            --poisson-replicates 200 \
            --output-dir artifacts/domain_null_and_declustering

      - name: Package reproducible source snapshots for permanent release
        if: success() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          tar -czf chaos-p2-2-source-snapshots.tar.gz \
            artifacts/real_data_stress/raw/ \
            artifacts/real_data_stress/derived/ \
            real_data_stress_pipeline/results/real_data_stress_manifest.json \
            real_data_stress_pipeline/results/SHA256SUMS.txt
          sha256sum chaos-p2-2-source-snapshots.tar.gz > chaos-p2-2-source-snapshots.tar.gz.sha256
          ls -lh chaos-p2-2-source-snapshots.tar.gz chaos-p2-2-source-snapshots.tar.gz.sha256

      - name: Upload raw source responses and complete numerical audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-2-stress-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            artifacts/real_data_stress/raw/
            artifacts/real_data_stress/derived/
            REAL_DATA_STRESS_REPORT_AR.md
            real_data_stress_pipeline/results/
            chaos-p2-2-source-snapshots.tar.gz
            chaos-p2-2-source-snapshots.tar.gz.sha256
            artifacts/markov_calibration_audit.json
            artifacts/markov_real_data_behavior/
            artifacts/markov_injected_break_power/
            artifacts/domain_null_and_declustering/

      - name: Create and publish the P2 phase-close audited release
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: p2-phase-close-v1.0
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "uniqueteamyemen"
          git config user.email "uniqueteamyemen@gmail.com"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          TAG_SHA="${SOURCE_SHA}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            git tag -a "${TAG_NAME}" "${TAG_SHA}" \
              -m "CHAOS P2 phase-close v1.0; source commit ${TAG_SHA}"
            git push origin "refs/tags/${TAG_NAME}"
          else
            existing="$(git ls-remote origin "refs/tags/${TAG_NAME}^{}" | awk '{print $1}')"
            if [ -z "${existing}" ]; then
              existing="$(git ls-remote origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
            fi
            if [ "${existing}" != "${TAG_SHA}" ]; then
              echo "Existing P2 phase-close tag points to a different commit: ${existing}" >&2
              exit 1
            fi
          fi
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --target "${TAG_SHA}" \
              --title "CHAOS P2 — Clean Phase Closure v1.0" \
              --notes-file REAL_DATA_STRESS_REPORT_AR.md
          fi
          gh release upload "${TAG_NAME}" \
            REAL_DATA_STRESS_REPORT_AR.md \
            real_data_stress_pipeline/results/real_data_stress_manifest.json \
            real_data_stress_pipeline/results/SHA256SUMS.txt \
            chaos-p2-2-source-snapshots.tar.gz \
            chaos-p2-2-source-snapshots.tar.gz.sha256 \
            --clobber

  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout PR merge ref with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen archives are unchanged
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/guards/check_experiments_immutable.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --triple-dot

      - name: Run pipeline contract tests
        run: python -m unittest discover -s real_data_stress_pipeline/tests -p 'test_*.py' -v

      - name: Run Markov, null-routing and seismic contract tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/audits -p 'test_p2_2_*.py' -v
          python -m unittest discover -s tests/audits -p 'test_p2_codex_polish.py' -v
          python -m unittest discover -s tests/audits -p 'test_p2_null_eligibility.py' -v
          python -m unittest discover -s tests/seismic_null_contract -p 'test_*.py' -v

      - name: Run bounded credentialless seismic audit
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/audits/p2_2_3_domain_null_and_declustering.py \
            --isolated-usgs-only \
            --max-belts 1 \
            --poisson-replicates 5 \
            --output-dir artifacts/domain_null_and_declustering

      - name: Upload PR gate audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-pr-gate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/domain_null_and_declustering/
