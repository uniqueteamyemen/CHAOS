name: CHAOS P2.2 — Automated Historical Sensor Stress Validation

on:
  pull_request:
    branches:
      - main-phase2
      - p2/phase-close-v1
  push:
    branches:
      - main-phase2
    paths:
      - 'real_data_stress_pipeline/**'
      - '!real_data_stress_pipeline/results/**'
      - 'structural_engine/isolated_break_detector_v1/**.py'
      - 'AGENTS.md'
      - 'LICENSE'
      - 'COPYRIGHT_AND_IP_NOTICE.md'
      - 'DATA_SOURCES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/real-data-stress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-p2-2-stress-v4-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish-phase1-archive:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main-phase2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout immutable Phase 1 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the immutable Phase 1 archive
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: 51e4278309b7d32917b85903323a63f81d9e9b6a
          TAG_NAME: phase1-detector-freeze-v1.0
        run: |
          set -euo pipefail
          git config user.name "uniqueteamyemen"
          git config user.email "uniqueteamyemen@gmail.com"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            git tag -a "${TAG_NAME}" "${BASELINE_SHA}" \
              -m "CHAOS Phase 1 frozen detector archive; canonical commit ${BASELINE_SHA}"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)" push origin "refs/tags/${TAG_NAME}"
          else
            existing="$(git ls-remote origin "refs/tags/${TAG_NAME}^{}" | awk '{print $1}')"
            if [ -z "${existing}" ]; then
              existing="$(git ls-remote origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
            fi
            if [ "${existing}" != "${BASELINE_SHA}" ]; then
              echo "Existing Phase 1 tag points to a different commit: ${existing}" >&2
              exit 1
            fi
          fi
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --target "${BASELINE_SHA}" \
              --title "CHAOS Phase 1 — Frozen Detector Archive" \
              --notes-file docs/PHASE1_DETECTOR_FREEZE.md
          fi
          mkdir -p /tmp/chaos-phase1-release
          git show "${BASELINE_SHA}:docs/PHASE1_DETECTOR_FREEZE.md" > /tmp/chaos-phase1-release/PHASE1_DETECTOR_FREEZE.md
          git show "${BASELINE_SHA}:structural_engine/isolated_break_detector_v1/results/real_data_transition_scan.json" > /tmp/chaos-phase1-release/real_data_transition_scan.json
          git show "${BASELINE_SHA}:structural_engine/isolated_break_detector_v1/results/SHA256SUMS.txt" > /tmp/chaos-phase1-release/SHA256SUMS.txt
          gh release upload "${TAG_NAME}" \
            /tmp/chaos-phase1-release/PHASE1_DETECTOR_FREEZE.md \
            /tmp/chaos-phase1-release/real_data_transition_scan.json \
            /tmp/chaos-phase1-release/SHA256SUMS.txt \
            --clobber

  prepare:
    needs: publish-phase1-archive
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main-phase2')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Checkout phase2 branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen detector archives
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PUSH_BASE_SHA}" && "${PUSH_BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            python scripts/guards/check_experiments_immutable.py --base "${PUSH_BASE_SHA}" --head "${PUSH_HEAD_SHA}"
          fi

      - name: Run three-stage prepare and freeze
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          STRESS_BOOTSTRAP_REPLICATES: '999'
          STRESS_BOOTSTRAP_MEAN_BLOCK_MONTHS: '12'
          STRESS_BOOTSTRAP_MEAN_BLOCK_EVENTS: '25'
          STRESS_MIN_COMMODITY_POINTS: '501'
          STRESS_MIN_GEM_POINTS: '87'
          STRESS_USGS_MIN_MAGNITUDE: '4.5'
          PYTHONUNBUFFERED: '1'
        run: python -u -m real_data_stress_pipeline.production_pipeline prepare --expected-candidates 519 --shards 4

      - name: Upload frozen source and candidate registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            artifacts/real_data_stress/
            real_data_stress_pipeline/results/prepare_state.json
            real_data_stress_pipeline/results/dependency_manifest.json

  evaluate:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      STRESS_BOOTSTRAP_REPLICATES: '999'
      STRESS_BOOTSTRAP_MEAN_BLOCK_MONTHS: '12'
      STRESS_BOOTSTRAP_MEAN_BLOCK_EVENTS: '25'
      STRESS_MIN_COMMODITY_POINTS: '501'
      STRESS_MIN_GEM_POINTS: '87'
      STRESS_USGS_MIN_MAGNITUDE: '4.5'
    steps:
      - name: Checkout exact prepared commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download frozen prepare artifact
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen runtime dependencies
        run: python -m real_data_stress_pipeline.production_pipeline verify-runtime

      - name: Evaluate weighted shard with bounded ProcessPool
        env:
          GITHUB_SHA: ${{ github.sha }}
          PYTHONUNBUFFERED: '1'
        run: python -u -m real_data_stress_pipeline.production_pipeline evaluate --shard ${{ matrix.shard }} --shards 4 --workers 4

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-eval-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: real_data_stress_pipeline/results/shard_results/

  aggregate-and-audit:
    needs: [prepare, evaluate]
    if: needs.prepare.result == 'success' && needs.evaluate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Checkout exact evaluated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download prepared source and registry
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Download matrix shard 0
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-eval-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: real_data_stress_pipeline/results/shard_results

      - name: Download matrix shard 1
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-eval-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: real_data_stress_pipeline/results/shard_results

      - name: Download matrix shard 2
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-eval-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: real_data_stress_pipeline/results/shard_results

      - name: Download matrix shard 3
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-eval-3-${{ github.run_id }}-${{ github.run_attempt }}
          path: real_data_stress_pipeline/results/shard_results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen runtime dependencies
        run: python -m real_data_stress_pipeline.production_pipeline verify-runtime

      - name: Strict aggregate gate and canonical manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          PYTHONUNBUFFERED: '1'
        run: python -u -m real_data_stress_pipeline.production_pipeline aggregate

      - name: Audit generated P2.2 Markov manifest
        run: |
          python scripts/audits/p2_2_2_markov_diagnostics.py \
            real_data_stress_pipeline/results/real_data_stress_manifest.json \
            --output artifacts/markov_calibration_audit.json

      - name: Upload complete aggregate and audit input
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            artifacts/real_data_stress/
            real_data_stress_pipeline/results/
            REAL_DATA_STRESS_REPORT_AR.md
            artifacts/markov_calibration_audit.json

  audit-markov-real-data:
    needs: aggregate-and-audit
    if: needs.aggregate-and-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download aggregate manifest
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install audit dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen runtime dependencies
        run: python -m real_data_stress_pipeline.production_pipeline verify-runtime

      - name: Run real-series Markov behavior audit against frozen source hash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          expected="$(python -c 'import json; m=json.load(open("real_data_stress_pipeline/results/real_data_stress_manifest.json", encoding="utf-8")); print(next(x["sha256"] for x in m["sources"] if x.get("provider") == "World Bank Pink Sheet"))')"
          python -u scripts/audits/p2_2_3_markov_real_data_behavior.py \
            --replicates 999 --workers 4 \
            --expected-source-sha256 "${expected}" \
            --output-dir artifacts/markov_real_data_behavior

      - name: Upload real-series Markov audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-markov-real-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: artifacts/markov_real_data_behavior/

  audit-markov-injected-break:
    needs: aggregate-and-audit
    if: needs.aggregate-and-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download aggregate manifest
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install audit dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen runtime dependencies
        run: python -m real_data_stress_pipeline.production_pipeline verify-runtime

      - name: Run injected-break power audit against frozen source hash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          expected="$(python -c 'import json; m=json.load(open("real_data_stress_pipeline/results/real_data_stress_manifest.json", encoding="utf-8")); print(next(x["sha256"] for x in m["sources"] if x.get("provider") == "World Bank Pink Sheet"))')"
          python -u scripts/audits/p2_2_4_markov_injected_break_power.py \
            --replicates 999 --workers 4 \
            --expected-source-sha256 "${expected}" \
            --output-dir artifacts/markov_injected_break_power

      - name: Upload injected-break power audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-markov-power-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: artifacts/markov_injected_break_power/

  audit-domain-null:
    needs: aggregate-and-audit
    if: needs.aggregate-and-audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      EIA_SERIES_IDS: ${{ vars.EIA_SERIES_IDS }}
    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download aggregate dependency manifest
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install audit dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen runtime dependencies
        run: python -m real_data_stress_pipeline.production_pipeline verify-runtime

      - name: Run seismic integrity, declustering and domain-null audit
        env:
          PYTHONUNBUFFERED: '1'
          FRED_API_KEY: ${{ github.ref == 'refs/heads/main-phase2' && secrets.FRED_API_KEY || '' }}
          EIA_API_KEY: ${{ github.ref == 'refs/heads/main-phase2' && secrets.EIA_API_KEY || '' }}
        run: |
          python -u scripts/audits/p2_2_3_domain_null_and_declustering.py \
            --poisson-replicates 200 \
            --output-dir artifacts/domain_null_and_declustering

      - name: Upload domain-null audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-domain-null-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: artifacts/domain_null_and_declustering/

  publish-phase-close:
    needs:
      - aggregate-and-audit
      - audit-markov-real-data
      - audit-markov-injected-break
      - audit-domain-null
    if: >-
      needs.aggregate-and-audit.result == 'success' &&
      needs.audit-markov-real-data.result == 'success' &&
      needs.audit-markov-injected-break.result == 'success' &&
      needs.audit-domain-null.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download aggregate outputs
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Download Markov real-data audit
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-markov-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/markov_real_data_behavior

      - name: Download Markov injected-break audit
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-markov-power-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/markov_injected_break_power

      - name: Download domain-null audit
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-domain-null-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/domain_null_and_declustering

      - name: Verify downloaded aggregate files against SHA-256 manifest
        run: |
          set -euo pipefail
          sha256sum --strict -c real_data_stress_pipeline/results/SHA256SUMS.txt

      - name: Verify all release gates and package reproducible snapshots
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("real_data_stress_pipeline/results/real_data_stress_manifest.json").read_text(encoding="utf-8"))
          expected = int(manifest.get("distributed_evaluation", {}).get("expected_series", 0))
          verified = int(manifest.get("distributed_evaluation", {}).get("verified_series", 0))
          if expected != 519 or verified != 519:
              raise SystemExit(f"release_blocked:series_integrity:{verified}/{expected}")
          for path in (
              "artifacts/markov_real_data_behavior/summary.json",
              "artifacts/markov_injected_break_power/summary.json",
              "artifacts/domain_null_and_declustering/summary.json",
              "artifacts/markov_calibration_audit.json",
          ):
              if not Path(path).is_file():
                  raise SystemExit(f"release_blocked:missing_audit:{path}")
          real = json.loads(Path("artifacts/markov_real_data_behavior/summary.json").read_text(encoding="utf-8"))
          power = json.loads(Path("artifacts/markov_injected_break_power/summary.json").read_text(encoding="utf-8"))
          pink_sha = next(x["sha256"] for x in manifest["sources"] if x.get("provider") == "World Bank Pink Sheet")
          if real.get("source", {}).get("sha256") != pink_sha:
              raise SystemExit("release_blocked:markov_real_source_sha_mismatch")
          if power.get("source", {}).get("source_sha256") != pink_sha:
              raise SystemExit("release_blocked:markov_power_source_sha_mismatch")
          domain = json.loads(Path("artifacts/domain_null_and_declustering/summary.json").read_text(encoding="utf-8"))
          if not domain.get("required_source_gate", {}).get("passed"):
              raise SystemExit("release_blocked:domain_null_source_gate_failed")
          print("RELEASE_GATES_PASSED")
          PY
          tar -czf chaos-p2-2-source-snapshots.tar.gz \
            artifacts/real_data_stress/raw/ \
            artifacts/real_data_stress/derived/ \
            artifacts/real_data_stress/candidate_shards/ \
            artifacts/real_data_stress/frozen_candidates.json \
            artifacts/real_data_stress/pink_precomputed_results.json \
            real_data_stress_pipeline/results/prepare_state.json \
            real_data_stress_pipeline/results/dependency_manifest.json \
            real_data_stress_pipeline/results/shard_results/ \
            real_data_stress_pipeline/results/real_data_stress_manifest.json \
            real_data_stress_pipeline/results/SHA256SUMS.txt
          sha256sum chaos-p2-2-source-snapshots.tar.gz > chaos-p2-2-source-snapshots.tar.gz.sha256
          ls -lh chaos-p2-2-source-snapshots.tar.gz chaos-p2-2-source-snapshots.tar.gz.sha256

      - name: Preflight every public release asset
        run: |
          set -euo pipefail
          # Release asset names must be unique; several audit outputs share generic
          # source filenames, so copy them to stable, descriptive release names.
          mkdir -p release_assets
          cp artifacts/markov_real_data_behavior/summary.json release_assets/markov-real-data-summary.json
          cp artifacts/markov_real_data_behavior/replicates.jsonl.gz release_assets/markov-real-data-replicates.jsonl.gz
          cp artifacts/markov_injected_break_power/summary.json release_assets/markov-injected-break-summary.json
          cp artifacts/markov_injected_break_power/replicates.jsonl.gz release_assets/markov-injected-break-replicates.jsonl.gz
          cp artifacts/domain_null_and_declustering/summary.json release_assets/domain-null-declustering-summary.json
          required_assets=(
            REAL_DATA_STRESS_REPORT_AR.md
            real_data_stress_pipeline/results/real_data_stress_manifest.json
            real_data_stress_pipeline/results/SHA256SUMS.txt
            artifacts/markov_calibration_audit.json
            release_assets/markov-real-data-summary.json
            release_assets/markov-real-data-replicates.jsonl.gz
            release_assets/markov-injected-break-summary.json
            release_assets/markov-injected-break-replicates.jsonl.gz
            release_assets/domain-null-declustering-summary.json
            chaos-p2-2-source-snapshots.tar.gz
            chaos-p2-2-source-snapshots.tar.gz.sha256
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -s "${asset}" ]]; then
              echo "release_preflight_missing_or_empty_asset:${asset}" >&2
              exit 1
            fi
          done
          echo "RELEASE_ASSET_PREFLIGHT_PASSED count=${#required_assets[@]}"

      - name: Publish P2 phase-close audited release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: p2-phase-close-v1.0
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "uniqueteamyemen"
          git config user.email "uniqueteamyemen@gmail.com"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            git tag -a "${TAG_NAME}" "${SOURCE_SHA}" -m "CHAOS P2 phase-close v1.0; source commit ${SOURCE_SHA}"
            git push origin "refs/tags/${TAG_NAME}"
          else
            existing="$(git ls-remote origin "refs/tags/${TAG_NAME}^{}" | awk '{print $1}')"
            if [ -z "${existing}" ]; then
              existing="$(git ls-remote origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
            fi
            if [ "${existing}" != "${SOURCE_SHA}" ]; then
              echo "Existing P2 phase-close tag points to a different commit: ${existing}" >&2
              exit 1
            fi
          fi
          assets=(
            REAL_DATA_STRESS_REPORT_AR.md
            real_data_stress_pipeline/results/real_data_stress_manifest.json
            real_data_stress_pipeline/results/SHA256SUMS.txt
            artifacts/markov_calibration_audit.json
            release_assets/markov-real-data-summary.json
            release_assets/markov-real-data-replicates.jsonl.gz
            release_assets/markov-injected-break-summary.json
            release_assets/markov-injected-break-replicates.jsonl.gz
            release_assets/domain-null-declustering-summary.json
            chaos-p2-2-source-snapshots.tar.gz
            chaos-p2-2-source-snapshots.tar.gz.sha256
          )

          verify_remote_assets() {
            local remote_json
            remote_json="$(gh release view "${TAG_NAME}" --json assets)"
            REMOTE_ASSETS_JSON="${remote_json}" python - "${assets[@]}" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          remote_document = json.loads(os.environ["REMOTE_ASSETS_JSON"])
          asset_names = [Path(local_name).name for local_name in sys.argv[1:]]
          if len(asset_names) != len(set(asset_names)):
              raise SystemExit("release_asset_local_names_not_unique")
          remote_by_name = {
              item.get("name"): item
              for item in remote_document.get("assets", [])
              if isinstance(item, dict) and item.get("name")
          }
          for local_name in sys.argv[1:]:
              local_path = Path(local_name)
              asset_name = local_path.name
              remote = remote_by_name.get(asset_name)
              if remote is None:
                  raise SystemExit(f"release_asset_missing_remote:{asset_name}")
              digest = hashlib.sha256(local_path.read_bytes()).hexdigest()
              expected_digest = f"sha256:{digest}"
              remote_digest = remote.get("digest")
              remote_size = remote.get("size")
              local_size = local_path.stat().st_size
              if remote_digest != expected_digest:
                  raise SystemExit(
                      f"release_asset_digest_mismatch:{asset_name}:"
                      f"expected={expected_digest}:actual={remote_digest}"
                  )
              if isinstance(remote_size, bool) or int(remote_size or -1) != local_size:
                  raise SystemExit(
                      f"release_asset_size_mismatch:{asset_name}:"
                      f"expected={local_size}:actual={remote_size}"
                  )
          print(f"REMOTE_RELEASE_ASSETS_VERIFIED count={len(sys.argv)-1}")
          PY
          }

          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            # Create a draft first. A public release is published only after every
            # required asset is uploaded and its remote digest/size are verified.
            gh release create "${TAG_NAME}" \
              --target "${SOURCE_SHA}" \
              --verify-tag \
              --draft \
              --title "CHAOS P2 — Clean Phase Closure v1.0" \
              --notes-file REAL_DATA_STRESS_REPORT_AR.md
          else
            is_draft="$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" == "false" ]]; then
              verify_remote_assets
              echo "P2 phase-close release already published with all required assets, digests and sizes; no mutation needed."
              exit 0
            fi
          fi

          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          verify_remote_assets
          # This is the sole transition that makes the completed release public.
          gh release edit "${TAG_NAME}" --draft=false

      - name: Upload complete phase-close deliverables
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-phase-close-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            REAL_DATA_STRESS_REPORT_AR.md
            real_data_stress_pipeline/results/real_data_stress_manifest.json
            real_data_stress_pipeline/results/SHA256SUMS.txt
            chaos-p2-2-source-snapshots.tar.gz
            chaos-p2-2-source-snapshots.tar.gz.sha256
            artifacts/markov_calibration_audit.json
            artifacts/markov_real_data_behavior/
            artifacts/markov_injected_break_power/
            artifacts/domain_null_and_declustering/

  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - name: Checkout PR merge ref with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Verify frozen archives are unchanged
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/guards/check_experiments_immutable.py --base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}" --triple-dot

      - name: Run pipeline contract tests
        run: python -m unittest discover -s real_data_stress_pipeline/tests -p 'test_*.py' -v

      - name: Run Markov, null-routing, seismic and production-pipeline contract tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/audits -p 'test_p2_2_*.py' -v
          python -m unittest discover -s tests/audits -p 'test_p2_codex_polish.py' -v
          python -m unittest discover -s tests/audits -p 'test_p2_production_pipeline.py' -v
          python -m unittest discover -s tests/audits -p 'test_p2_null_eligibility.py' -v
          python -m unittest discover -s tests/seismic_null_contract -p 'test_*.py' -v

      - name: Run bounded credentialless seismic audit
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u scripts/audits/p2_2_3_domain_null_and_declustering.py \
            --isolated-usgs-only \
            --max-belts 1 \
            --poisson-replicates 5 \
            --output-dir artifacts/domain_null_and_declustering

      - name: Upload PR gate audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p2-pr-gate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/domain_null_and_declustering/
