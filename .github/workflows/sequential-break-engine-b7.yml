name: CHAOS B-v7 Quantized Block Fusion Calibration

on:
  push:
    branches:
      - experiment/b7-quantized-block-fusion
    paths:
      - "experiments/identity_lab/exp_sequential_break_b7_quantized_block_fusion/**"
      - ".github/workflows/sequential-break-engine-b7.yml"

permissions:
  contents: read

jobs:
  quantized-block-fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Run B-v7 block, quantization, gate and lifecycle tests
        run: python -m unittest experiments.identity_lab.exp_sequential_break_b7_quantized_block_fusion.test_b7 -v
      - name: Run paired 10M development grid and 11M pristine holdout
        run: python -m experiments.identity_lab.exp_sequential_break_b7_quantized_block_fusion.benchmark_b7 --dev-trials 500 --holdout-trials 500
      - name: Upload full B-v7 and B-v6a Pearson comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-b7-quantized-block-fusion-pristine-comparison
          path: experiments/identity_lab/exp_sequential_break_b7_quantized_block_fusion/results/sequential_break_engine_b7_quantized_block_fusion_comparison.json
          if-no-files-found: error
          retention-days: 90
