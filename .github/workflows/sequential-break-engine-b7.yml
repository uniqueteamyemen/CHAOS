name: CHAOS B-v7 Robust Innovation Sign-Likelihood CUSUM (24M/25M)

on:
  push:
    branches:
      - experiment/b7-innovation-sign-cusum
    paths:
      - "experiments/identity_lab/exp_sequential_break_b7_innovation_sign_cusum/**"
      - ".github/workflows/sequential-break-engine-b7.yml"

permissions:
  contents: read

jobs:
  innovation-sign-cusum:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Run B-v7 unit and invariant tests
        run: python -m unittest experiments.identity_lab.exp_sequential_break_b7_innovation_sign_cusum.test_b7 -v
      - name: Run smoke test with separate non-official seeds
        run: python -m experiments.identity_lab.exp_sequential_break_b7_innovation_sign_cusum.benchmark_b7 --smoke
      - name: Run official 24M development selection and 25M paired holdout
        run: python -m experiments.identity_lab.exp_sequential_break_b7_innovation_sign_cusum.benchmark_b7
      - name: Upload complete B-v7 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-b7-innovation-sign-likelihood-cusum-24m-25m
          path: experiments/identity_lab/exp_sequential_break_b7_innovation_sign_cusum/results/sequential_break_engine_b7_innovation_sign_cusum_24m_25m.json
          if-no-files-found: warn
          retention-days: 90
