name: CHAOS C3 v2.2 — FOCuS Scale Ablation

on:
  push:
    branches:
      - experiment/c3-focus-ablation-v1
    paths:
      - ".github/workflows/c3-v2-2-focus-ablation.yml"
      - "p1_4_validation/c3/run_c3_v2_2_focus_ablation.py"
      - "p1_4_validation/c3/run_c3_v2_2_equal_risk_evaluation.py"
      - "p1_4_validation/c3/focus_rearm_v2_2.py"
      - "p1_4_validation/c3/c3_expanded_event_cohort_v2_2.json"
      - "tests/governance/test_c3_v2_2_focus_ablation.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-c3-focus-ablation-v1
  cancel-in-progress: false

jobs:
  focus-scale-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      SOURCE_INTAKE_RUN_ID: "45757611871"
      SOURCE_ARTIFACT_ID: "15088960800"
      SOURCE_ARTIFACT_NAME: "chaos-c3-v2-expanded-source-intake-45757611871-1"
    steps:
      - name: Enforce isolated branch and frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/experiment/c3-focus-ablation-v1" || {
            echo "C3_FOCUS_ABLATION_WRONG_BRANCH:$GITHUB_REF" >&2
            exit 1
          }
          test "$SOURCE_INTAKE_RUN_ID" = "45757611871"
          test "$SOURCE_ARTIFACT_ID" = "15088960800"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen runtime dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Download the exact existing C3 source-intake artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_INTAKE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/c3-focus-source

      - name: Verify source identity and assemble replay ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path("/tmp/c3-focus-source")
          manifest_path = root / "expanded_source_intake_manifest.json"
          tape_path = root / "expanded_initial_release_tape.csv"
          if not manifest_path.is_file() or not tape_path.is_file():
              raise SystemExit("C3_FOCUS_SOURCE_REQUIRED_FILES_MISSING")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if str(manifest.get("workflow_run_id")) != os.environ["SOURCE_INTAKE_RUN_ID"]:
              raise SystemExit("C3_FOCUS_SOURCE_RUN_ID_MISMATCH")
          if manifest.get("status") != "SOURCE_TAPES_ACQUIRED_NOT_DETECTOR_EXECUTED":
              raise SystemExit("C3_FOCUS_SOURCE_STATUS_MISMATCH")
          if manifest.get("contract_id") != "CHAOS_P1_4_C3_EXPANDED_EVENT_COHORT_V1":
              raise SystemExit("C3_FOCUS_SOURCE_CONTRACT_MISMATCH")
          if len(manifest.get("raw_vintage_batches", [])) == 0:
              raise SystemExit("C3_FOCUS_RAW_BATCHES_MISSING")
          output = Path("/tmp/c3-v2-source-intake.zip")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("C3_FOCUS_REPLAY_ZIP_CORRUPT")
          print(
              "C3_FOCUS_SOURCE_READY "
              f"run_id={manifest['workflow_run_id']} "
              f"points={manifest['point_count']} "
              f"raw_batches={len(manifest['raw_vintage_batches'])} "
              f"zip_bytes={output.stat().st_size}"
          )
          PY

      - name: Compile ablation runner and tests
        run: |
          set -euo pipefail
          python -m py_compile \
            p1_4_validation/c3/run_c3_v2_2_focus_ablation.py \
            p1_4_validation/c3/run_c3_v2_2_equal_risk_evaluation.py

      - name: Run focused governance tests
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest discover \
            -s tests/governance \
            -p 'test_c3_v2_2_focus_ablation.py' -v

      - name: Execute 1,000 Development + 1,000 Holdout FOCuS ablations
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -u \
            p1_4_validation/c3/run_c3_v2_2_focus_ablation.py \
            --source-zip /tmp/c3-v2-source-intake.zip \
            --contract p1_4_validation/c3/c3_expanded_event_cohort_v2_2.json \
            --expected-source-run-id "$SOURCE_INTAKE_RUN_ID" \
            --replicates 1000 \
            --output artifacts/p1_4/c3/focus_ablation_v1/FOCUS_ABLATION.json

      - name: Publish reproducibility and result summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# C3 v2.2 — FOCuS Scale Ablation"
            echo
            echo "- Evaluation commit: $GITHUB_SHA"
            echo "- Evaluation run: $GITHUB_RUN_ID"
            echo "- Frozen source-intake run: $SOURCE_INTAKE_RUN_ID"
            echo "- Frozen source artifact ID: $SOURCE_ARTIFACT_ID"
            echo
            if [[ -s artifacts/p1_4/c3/focus_ablation_v1/FOCUS_ABLATION.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/p1_4/c3/focus_ablation_v1/FOCUS_ABLATION.json").read_text())
          print(f"Status: {report['status']}")
          print(f"Arms: {len(report['arms'])}")
          for arm in report["arms"]:
              dev = arm["development"]
              hold = arm["holdout"]
              hist = arm["historical"]
              print(
                  f"- {arm['arm_id']}: "
                  f"Dev U95={dev['wilson_upper_95_one_sided']} "
                  f"Holdout U95={hold['wilson_upper_95_one_sided']} "
                  f"risk={arm['risk_validation_status']} "
                  f"events={hist['matched_event_series_pairs']} "
                  f"unmatched={hist['unmatched_alarm_count']} "
                  f"prefix_replays={hist['no_lookahead_prefix_replays']}"
              )
          PY
            else
              echo "Ablation report unavailable; inspect the failed job step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FOCuS ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-c3-focus-ablation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p1_4/c3/focus_ablation_v1/
          retention-days: 90
          if-no-files-found: warn
