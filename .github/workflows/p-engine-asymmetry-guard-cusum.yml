name: CHAOS P-engine Asymmetry-Guarded Bounded CUSUM screen

on:
  push:
    branches:
      - experiment/p-engine-parallel-fusion-v1
    paths:
      - "experiments/identity_lab/exp_p_engine_holdout/asymmetry_guarded_cusum.py"
      - "experiments/identity_lab/exp_p_engine_holdout/test_asymmetry_guarded_cusum.py"
      - ".github/workflows/p-engine-asymmetry-guard-cusum.yml"

permissions:
  contents: read

jobs:
  asymmetry-guard-cusum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download completed H paired robustness report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 43728610028
          name: chaos-p-engine-robustness-holdout
          path: ${{ runner.temp }}/p-engine-h
      - name: Test AG-CUSUM equations and scoring
        run: python -m unittest experiments.identity_lab.exp_p_engine_holdout.test_asymmetry_guarded_cusum -v
      - name: Run AG-CUSUM on the exact H seed range
        run: >-
          python -m experiments.identity_lab.exp_p_engine_holdout.asymmetry_guarded_cusum
          --h-report ${{ runner.temp }}/p-engine-h/cusum_robust_holdout.json
      - name: Upload AG-CUSUM paired H screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p-engine-asymmetry-guard-cusum
          path: experiments/identity_lab/exp_p_engine_holdout/results/asymmetry_guarded_cusum_h_screen.json
          if-no-files-found: warn
          retention-days: 90
