name: CHAOS B-v6.1 Surgical SARP-SAGP Factorial (12M/13M)

on:
  push:
    branches:
      - experiment/b6-1-sarp-sagp-factorial
    paths:
      - "experiments/identity_lab/exp_sequential_break_b61_sarp_sagp_factorial/**"
      - ".github/workflows/sequential-break-engine-b61.yml"

permissions:
  contents: read

jobs:
  factorial-and-pristine-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.2.6
      - name: Run B-v6.1 factor and parity tests
        run: python -m unittest experiments.identity_lab.exp_sequential_break_b61_sarp_sagp_factorial.test_b61 -v
      - name: Run isolated smoke test before protected seeds
        run: python -m experiments.identity_lab.exp_sequential_break_b61_sarp_sagp_factorial.benchmark_b61 --smoke
      - name: Run official 12M factorial and 13M paired validation
        run: python -m experiments.identity_lab.exp_sequential_break_b61_sarp_sagp_factorial.benchmark_b61
      - name: Upload B-v6.1 full factorial and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-b61-sarp-sagp-factorial-12m-13m
          path: experiments/identity_lab/exp_sequential_break_b61_sarp_sagp_factorial/results/sequential_break_engine_b61_sarp_sagp_factorial_12m_13m.json
          if-no-files-found: warn
          retention-days: 90
