name: CHAOS P-engine AG-CUSUM untouched-seed confirmation

on:
  push:
    branches:
      - experiment/p-engine-parallel-fusion-v1
    paths:
      - "experiments/identity_lab/exp_p_engine_holdout/asymmetry_guarded_cusum_confirmation.py"
      - "experiments/identity_lab/exp_p_engine_holdout/test_asymmetry_guarded_cusum_confirmation.py"
      - ".github/workflows/p-engine-asymmetry-guard-cusum-confirmation.yml"

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test confirmation sample gate
        run: python -m unittest experiments.identity_lab.exp_p_engine_holdout.test_asymmetry_guarded_cusum_confirmation -v
      - name: Run 1000 fresh seeds per H scenario with fixed AG-CUSUM defaults
        run: python -m experiments.identity_lab.exp_p_engine_holdout.asymmetry_guarded_cusum_confirmation
      - name: Upload untouched-seed confirmation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p-engine-ag-cusum-confirmation
          path: experiments/identity_lab/exp_p_engine_holdout/results/asymmetry_guarded_cusum_confirmation.json
          if-no-files-found: warn
          retention-days: 90
