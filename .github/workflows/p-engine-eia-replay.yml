name: CHAOS P-engine EIA real-series replay

on:
  push:
    branches:
      - experiment/p-engine-parallel-fusion-v1
    paths:
      - "experiments/identity_lab/exp_p_engine_holdout/eia_real_replay.py"
      - "experiments/identity_lab/exp_p_engine_holdout/test_eia_real_replay.py"
      - "experiments/identity_lab/exp_c_eia/raw/**"
      - "experiments/identity_lab/exp_r_grade4/EIA_SNAPSHOT.sha256"
      - ".github/workflows/p-engine-eia-replay.yml"

permissions:
  contents: read

jobs:
  eia-real-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed EIA snapshot checksums
        run: cd experiments/identity_lab/exp_c_eia/raw && sha256sum -c ../../exp_r_grade4/EIA_SNAPSHOT.sha256
      - name: Test EIA replay data contracts
        run: python -m unittest experiments.identity_lab.exp_p_engine_holdout.test_eia_real_replay -v
      - name: Replay selected candidates on archived EIA weekly series
        run: python -m experiments.identity_lab.exp_p_engine_holdout.eia_real_replay
      - name: Upload EIA real-series replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p-engine-eia-real-replay
          path: experiments/identity_lab/exp_p_engine_holdout/results/eia_weekly_real_series_replay.json
          if-no-files-found: warn
          retention-days: 90
