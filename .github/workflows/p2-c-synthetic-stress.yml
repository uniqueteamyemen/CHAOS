name: CHAOS P2-C — Synthetic Stress Gates

on:
  push:
    branches:
      - feat/p2-c-detector-implementation-v1
    paths:
      - "p2_b_benchmark/**"
      - ".github/workflows/p2-c-synthetic-stress.yml"

permissions:
  contents: read

concurrency:
  group: chaos-p2-c-synthetic-stress-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-stress:
    name: P2-C synthetic gates (no 509-series data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Preserve and run complete P2-B contract suite
        run: python -m unittest p2_b_benchmark.tests.test_core -v
      - name: Run eight P2-C synthetic stress gates
        run: python -m unittest p2_b_benchmark.tests.test_p2c_stress -v
      - name: Confirm no P2-B checksum files were silently changed
        run: git diff --exit-code -- p2_b_benchmark/SHA256SUMS.txt
