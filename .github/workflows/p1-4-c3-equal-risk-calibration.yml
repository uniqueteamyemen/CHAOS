name: CHAOS P1.4 C3 v2 — Expanded Cohort & Self-Calibrating Thresholds

"on":
  workflow_dispatch:
    inputs:
      execute_c3_equal_risk_calibration:
        description: "Run C3 v2 ALFRED intake, then Dev-Wilson calibration, Holdout and historical evaluation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-c3-v2-expanded-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require isolated C3 v2 branch and explicit approval
        shell: bash
        env:
          EXECUTE_C3_V2: ${{ inputs.execute_c3_equal_risk_calibration }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/c3-v2-expanded-cohort-self-calibrating" || {
            echo "C3_V2_WRONG_BRANCH:$GITHUB_REF" >&2
            exit 1
          }
          test "$EXECUTE_C3_V2" = "true" || {
            echo "C3_V2_EXECUTION_INPUT_NOT_ENABLED" >&2
            exit 1
          }

  expanded-source-intake:
    needs: validate-dispatch
    if: ${{ inputs.execute_c3_equal_risk_calibration == true }}
    uses: ./.github/workflows/p1-4-c3-v2-source-intake.yml
    secrets: inherit

  expanded-equal-risk-evaluation:
    needs:
      - validate-dispatch
      - expanded-source-intake
    if: ${{ inputs.execute_c3_equal_risk_calibration == true }}
    uses: ./.github/workflows/p1-4-c3-v2-expanded-evaluation.yml
    with:
      source_intake_run_id: ${{ github.run_id }}
      source_intake_artifact_name: chaos-c3-v2-expanded-source-intake-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit
