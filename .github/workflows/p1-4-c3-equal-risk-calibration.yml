name: CHAOS P1.4 C3 v2.1 — Operational Detector Optimization

"on":
  workflow_dispatch:
    inputs:
      execute_c3_equal_risk_calibration:
        description: "Run C3 v2.1 optimization, reusing the saved ALFRED artifact when a source run ID is provided"
        required: true
        type: boolean
        default: false
      reuse_source_intake_run_id:
        description: "Optional completed source-intake run ID. Set 45757611871 to reuse chaos-c3-v2-expanded-source-intake-45757611871-1 without another ALFRED download."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-c3-v2-1-optimization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require isolated C3 v2.1 branch and explicit approval
        shell: bash
        env:
          EXECUTE_C3_V2: ${{ inputs.execute_c3_equal_risk_calibration }}
          REUSE_SOURCE_INTAKE_RUN_ID: ${{ inputs.reuse_source_intake_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/c3-v2-expanded-cohort-self-calibrating" || {
            echo "C3_V2_WRONG_BRANCH:$GITHUB_REF" >&2
            exit 1
          }
          test "$EXECUTE_C3_V2" = "true" || {
            echo "C3_V2_EXECUTION_INPUT_NOT_ENABLED" >&2
            exit 1
          }
          if [[ -n "$REUSE_SOURCE_INTAKE_RUN_ID" && ! "$REUSE_SOURCE_INTAKE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "C3_V2_INVALID_REUSE_SOURCE_INTAKE_RUN_ID:$REUSE_SOURCE_INTAKE_RUN_ID" >&2
            exit 1
          fi

  expanded-source-intake:
    needs: validate-dispatch
    if: ${{ inputs.execute_c3_equal_risk_calibration == true && inputs.reuse_source_intake_run_id == '' }}
    uses: ./.github/workflows/p1-4-c3-v2-source-intake.yml
    secrets: inherit

  expanded-equal-risk-evaluation:
    needs:
      - validate-dispatch
      - expanded-source-intake
    if: >-
      ${{ always() &&
          inputs.execute_c3_equal_risk_calibration == true &&
          needs.validate-dispatch.result == 'success' &&
          (needs.expanded-source-intake.result == 'success' ||
           inputs.reuse_source_intake_run_id != '') }}
    uses: ./.github/workflows/p1-4-c3-v2-expanded-evaluation.yml
    with:
      source_intake_run_id: ${{ inputs.reuse_source_intake_run_id != '' && inputs.reuse_source_intake_run_id || github.run_id }}
      source_intake_artifact_name: chaos-c3-v2-expanded-source-intake-${{ inputs.reuse_source_intake_run_id != '' && inputs.reuse_source_intake_run_id || github.run_id }}-${{ inputs.reuse_source_intake_run_id != '' && '1' || github.run_attempt }}
    secrets: inherit
