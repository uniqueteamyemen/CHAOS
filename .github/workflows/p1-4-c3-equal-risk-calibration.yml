name: CHAOS P1.4 C3 — Equal-Risk Calibration

on:
  workflow_dispatch:
    inputs:
      execute_c3_equal_risk_calibration:
        description: "Select the dedicated C3 equal-risk calibration branch to run the isolated evaluation."
        required: true
        type: boolean
        default: false
      reuse_source_intake_run_id:
        description: "Optional completed C3 v2.1 source-intake run ID. Use 45757611871 to reuse the archived ALFRED artifact without downloading again."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  default-branch-registration:
    if: ${{ github.ref == 'refs/heads/main-phase2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Select the C3 equal-risk implementation branch
        run: |
          echo "This default-branch workflow only registers the manual action."
          echo "Select feat/c3-v2-expanded-cohort-self-calibrating in the branch selector."
          echo "Set execute_c3_equal_risk_calibration=true. Set reuse_source_intake_run_id=45757611871 to reuse the saved source artifact."
