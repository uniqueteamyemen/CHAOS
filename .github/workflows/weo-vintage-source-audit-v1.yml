name: CHAOS — WEO 2020 Source Vintage Audit

on:
  pull_request:
    branches:
      - main-phase2
  push:
    branches:
      - 'discovery/**'
    paths:
      - 'discovery_engine/weo_vintage_audit_v1.py'
      - 'discovery_engine/weo_hf_mirror_v1.py'
      - 'scripts/discovery/run_weo_vintage_audit_v1.py'
      - 'tests/discovery/test_weo_vintage_audit_v1.py'
      - 'tests/discovery/test_weo_hf_mirror_v1.py'
      - 'experimental_contracts/WEO_GDP_GROWTH_VINTAGE_AUDIT_CONTRACT_V1.json'
      - 'catalog_first/readiness_gate/macro_plus_eia_energy/MACRO_PLUS_EIA_ENERGY_COMPLETE_139_NUMERIC_RAW_2000_2024_WIDE.csv'
      - '.github/workflows/weo-vintage-source-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chaos-discovery-artifact-writers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weo-vintage-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout discovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned WEO mirror reader dependencies
        run: python -m pip install --disable-pip-version-check huggingface_hub pyarrow
      - name: Compile vintage audit and validate contract
        run: |
          python -m py_compile discovery_engine/weo_vintage_audit_v1.py discovery_engine/weo_hf_mirror_v1.py scripts/discovery/run_weo_vintage_audit_v1.py
          python -m json.tool experimental_contracts/WEO_GDP_GROWTH_VINTAGE_AUDIT_CONTRACT_V1.json
      - name: Run source vintage audit unit tests
        run: python -m unittest discover -s tests/discovery -p 'test_weo_*.py' -v
      - name: Download official historical WEO vintages and compare
        run: python scripts/discovery/run_weo_vintage_audit_v1.py
      - name: Verify raw and derived artifact hashes and actual-estimate classification
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          out = root / "discovery/source_vintage_v1"
          summary = json.loads((out / "WEO_GDP_GROWTH_2020_VINTAGE_AUDIT_V1.json").read_text())
          manifest = json.loads((out / "WEO_GDP_GROWTH_VINTAGE_MANIFEST_V1.json").read_text())
          for entry in manifest["derived_artifacts"]:
              path = root / entry["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"]
          assert len(summary["downloads"]) == 2
          for acquisition in summary["downloads"]:
              if acquisition["source_type"] == "OFFICIAL_IMF_DIRECT":
                  path = out / "raw_downloads" / acquisition["local_raw_file"]
                  assert path.is_file()
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == acquisition["sha256"]
              elif acquisition["source_type"] == "THIRD_PARTY_DERIVED_MIRROR":
                  mirror = acquisition["mirror_source"]
                  assert mirror["revision"]
                  assert mirror["repository_id"] == "econdataverse/imfweo"
                  assert mirror["metadata_missing_for_actual_estimate_status"] is True
                  for shard in mirror["parquet_files"]:
                      path = Path(shard["local_path"])
                      assert path.is_file()
                      assert hashlib.sha256(path.read_bytes()).hexdigest() == shard["sha256"]
              else:
                  raise AssertionError(f"unknown source type: {acquisition['source_type']}")
          for vintage in summary["vintages"]:
              if vintage["vintage_id"] == "WEO_APR2026_PANEL_STAGED":
                  continue
              status = vintage["event_2020_status"]
              assert status["actual"] + status["estimate_or_projection"] + status["unknown"] == vintage["complete_2016_2020_rows"]
              if vintage.get("source_type") == "THIRD_PARTY_DERIVED_MIRROR":
                  assert status["unknown"] == vintage["complete_2016_2020_rows"]

          print(json.dumps({
              "status": summary["status"],
              "comparison_iso_count": summary["comparison_iso_count"],
              "vintages": summary["vintages"],
              "downloads": summary["downloads"],
              "secondary_mirror": summary["secondary_mirror"],
          }, sort_keys=True))
          PY
      - name: Commit derived vintage audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/source_vintage_v1/WEO_GDP_GROWTH_2020_VINTAGE_AUDIT_V1.json
          git add discovery/source_vintage_v1/WEO_GDP_GROWTH_2020_VINTAGE_COMPARISON_V1.csv
          git add discovery/source_vintage_v1/WEO_GDP_GROWTH_VINTAGE_MANIFEST_V1.json
          if ! git diff --cached --quiet; then
            git commit -m "data(chaos): record official WEO vintage audit"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload raw WEO vintage files and derived evidence
        uses: actions/upload-artifact@v4
        with:
          name: chaos-weo-vintage-source-audit-${{ github.sha }}
          path: discovery/source_vintage_v1/
          if-no-files-found: error
          retention-days: 90

  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout pull request merge candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WEO mirror reader dependencies
        run: python -m pip install --disable-pip-version-check huggingface_hub pyarrow
      - name: Compile vintage audit and validate contract
        run: |
          python -m py_compile discovery_engine/weo_vintage_audit_v1.py discovery_engine/weo_hf_mirror_v1.py scripts/discovery/run_weo_vintage_audit_v1.py
          python -m json.tool experimental_contracts/WEO_GDP_GROWTH_VINTAGE_AUDIT_CONTRACT_V1.json
      - name: Run WEO source vintage audit unit tests
        run: python -m unittest discover -s tests/discovery -p 'test_weo_*.py' -v
      - name: Rebuild WEO vintage audit from source vintages
        run: python scripts/discovery/run_weo_vintage_audit_v1.py
      - name: Verify downloaded and derived hashes and preserve unknown actual-estimate status
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path.cwd()
          out = root / "discovery/source_vintage_v1"
          summary = json.loads((out / "WEO_GDP_GROWTH_2020_VINTAGE_AUDIT_V1.json").read_text())
          manifest = json.loads((out / "WEO_GDP_GROWTH_VINTAGE_MANIFEST_V1.json").read_text())

          for entry in manifest["derived_artifacts"]:
              path = root / entry["path"]
              assert path.is_file(), entry["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"], entry["path"]

          assert len(summary["downloads"]) == 2
          for acquisition in summary["downloads"]:
              if acquisition["source_type"] == "OFFICIAL_IMF_DIRECT":
                  path = out / "raw_downloads" / acquisition["local_raw_file"]
                  assert path.is_file()
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == acquisition["sha256"]
              elif acquisition["source_type"] == "THIRD_PARTY_DERIVED_MIRROR":
                  mirror = acquisition["mirror_source"]
                  assert mirror["revision"]
                  assert mirror["repository_id"] == "econdataverse/imfweo"
                  assert mirror["metadata_missing_for_actual_estimate_status"] is True
                  for shard in mirror["parquet_files"]:
                      path = Path(shard["local_path"])
                      assert path.is_file()
                      assert hashlib.sha256(path.read_bytes()).hexdigest() == shard["sha256"]
              else:
                  raise AssertionError(f"unknown source type: {acquisition['source_type']}")

          for vintage in summary["vintages"]:
              if vintage["vintage_id"] == "WEO_APR2026_PANEL_STAGED":
                  continue
              status = vintage["event_2020_status"]
              assert status["actual"] + status["estimate_or_projection"] + status["unknown"] == vintage["complete_2016_2020_rows"]
              if vintage.get("source_type") == "THIRD_PARTY_DERIVED_MIRROR":
                  assert status["unknown"] == vintage["complete_2016_2020_rows"]

          print(json.dumps({
              "status": summary["status"],
              "comparison_iso_count": summary["comparison_iso_count"],
              "vintages": summary["vintages"],
              "downloads": summary["downloads"],
              "secondary_mirror": summary["secondary_mirror"],
          }, sort_keys=True))
          PY
