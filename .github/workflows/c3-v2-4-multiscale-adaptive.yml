name: CHAOS C3 v2.4 — MultiScale Adaptive

on:
  push:
    branches: [experiment/c3-v2-4-multiscale-adaptive-v1]
    paths:
      - '.github/workflows/c3-v2-4-multiscale-adaptive.yml'
      - 'p1_4_validation/c3/causal_multiscale_adaptive.py'
      - 'p1_4_validation/c3/c3_v2_4_multiscale_preregistration.json'
      - 'p1_4_validation/c3/run_c3_v2_4_multiscale.py'
      - 'p1_4_validation/c3/prepare_c3_v2_4_source.py'
      - 'p1_4_validation/c3/summarize_c3_v2_4_report.py'
      - 'tests/governance/test_c3_v2_4_multiscale_adaptive.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-c3-v2-4-multiscale-adaptive-v1
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SOURCE_INTAKE_RUN_ID: '45757611871'
      SOURCE_ARTIFACT_ID: '15088960800'
      SOURCE_ARTIFACT_NAME: chaos-c3-v2-expanded-source-intake-45757611871-1
      SOURCE_ARTIFACT_SHA256: e9760015cad58c96171fb45c486345b8a4ded64f9c5379b59192e435366c45d3
      SOURCE_TAPE_SHA256: f81a4e802e62ff5effaeae2240d1f3835d2e3650037887cdea4aaf79816959c1
      EVALUATION_CONTRACT_SHA256: 0da3b68ead082157eb586dd1952afc3f7006dc85bbc7edf2ef1e702951360d49

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Enforce isolated branch and frozen inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/experiment/c3-v2-4-multiscale-adaptive-v1
          test "$SOURCE_INTAKE_RUN_ID" = 45757611871
          test "$SOURCE_ARTIFACT_ID" = 15088960800
          python - <<'PY'
          import json
          p = json.load(open("p1_4_validation/c3/c3_v2_4_multiscale_preregistration.json", encoding="utf-8"))
          assert p["status"] == "PRE_REGISTERED"
          assert p["null_protocol"]["replicates_per_phase"] == 2000
          assert p["null_protocol"]["seed_namespace"] == "CHAOS:C3_V2_4_MULTISCALE_ADAPTIVE_2000X2_V1_PREREG_20261128"
          assert p["risk_gates"]["development_wilson_u95_max"] == 0.085
          assert p["risk_gates"]["holdout_wilson_u95_max"] == 0.10
          assert p["source"]["source_intake_run_id"] == "45757611871"
          assert p["source"]["source_artifact_id"] == 15088960800
          print("C3_V2_4_PREREGISTRATION_FIELDS_VERIFIED")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen runtime dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Verify exact existing GitHub artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > /tmp/source.json
          python - <<'PY'
          import json, os
          a = json.load(open("/tmp/source.json", encoding="utf-8"))
          assert a["id"] == int(os.environ["SOURCE_ARTIFACT_ID"])
          assert a["name"] == os.environ["SOURCE_ARTIFACT_NAME"]
          assert a["digest"] == "sha256:" + os.environ["SOURCE_ARTIFACT_SHA256"]
          assert a["expired"] is False
          assert int(a["workflow_run"]["id"]) == int(os.environ["SOURCE_INTAKE_RUN_ID"])
          print("FROZEN_SOURCE_ARTIFACT_METADATA_VERIFIED")
          PY
      - name: Download exact frozen source intake
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          run-id: ${{ env.SOURCE_INTAKE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/c3-v2-4-source
      - name: Verify source and create deterministic archive
        run: python p1_4_validation/c3/prepare_c3_v2_4_source.py
      - name: Verify frozen evaluation contract
        run: |
          echo "$EVALUATION_CONTRACT_SHA256  p1_4_validation/c3/c3_expanded_event_cohort_v2_2.json" | sha256sum -c -
      - name: Compile experiment and tests
        run: |
          python -m py_compile \
            p1_4_validation/c3/causal_multiscale_adaptive.py \
            p1_4_validation/c3/run_c3_v2_4_multiscale.py \
            p1_4_validation/c3/prepare_c3_v2_4_source.py \
            p1_4_validation/c3/summarize_c3_v2_4_report.py \
            tests/governance/test_c3_v2_4_multiscale_adaptive.py
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Run focused governance tests
        run: pytest -q tests/governance/test_c3_v2_4_multiscale_adaptive.py
      - name: Execute 2,000 Development + 2,000 independent Holdout per target series
        run: |
          python p1_4_validation/c3/run_c3_v2_4_multiscale.py \
            --source-zip /tmp/c3-v2-4-frozen-source.zip \
            --contract p1_4_validation/c3/c3_expanded_event_cohort_v2_2.json \
            --protocol p1_4_validation/c3/c3_v2_4_multiscale_preregistration.json \
            --expected-source-run-id "$SOURCE_INTAKE_RUN_ID" \
            --replicates 2000 \
            --output-dir artifacts/p1_4/c3/v2_4_multiscale_adaptive
      - name: Publish compact result summary
        if: always()
        run: python p1_4_validation/c3/summarize_c3_v2_4_report.py
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-c3-v2-4-multiscale-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p1_4/c3/v2_4_multiscale_adaptive/
          retention-days: 90
          if-no-files-found: warn
