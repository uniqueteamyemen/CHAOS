name: CHAOS P1.4 C3 — Historical Break Detector Evaluation

on:
  workflow_dispatch:
    inputs:
      execute_c3_historical_evaluation:
        description: "Run the frozen C3 historical detector head-to-head evaluation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-p1-4-c3-historical-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  historical-evaluation:
    if: ${{ inputs.execute_c3_historical_evaluation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Require the active P1.4 implementation branch
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/feat/p1-4-capability-envelope-pilot-v1-20261125|refs/heads/feat/c3-historical-break-evaluation-v1) ;;
            *) echo "C3_HISTORICAL_EVALUATION_WRONG_BRANCH:$GITHUB_REF" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen runtime dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Download and verify the immutable C3 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15079733940/zip \
            -o /tmp/c3-source-intake-45738391381.zip
          echo "8b4c7c4bc0cca7aea5a1346fdbd8f1f41076a88ae73622ff6331aad912a30c59  /tmp/c3-source-intake-45738391381.zip" | sha256sum --check

      - name: Run C3 evaluation contract tests
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest discover \
            -s tests/governance -p 'test_c3_historical_break_evaluation.py' -v

      - name: Run historical detector head-to-head
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python -u \
            p1_4_validation/c3/run_historical_break_evaluation.py \
            --artifact-zip /tmp/c3-source-intake-45738391381.zip \
            --contract p1_4_validation/c3/c3_source_contract_v1.json \
            --intake-contract p1_4_validation/c3/c3_source_intake_contract_v1.json \
            --output-dir artifacts/p1_4/c3/historical_evaluation

      - name: Publish complete C3 tables to GitHub Step Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# C3 — Historical Break Detector Evaluation"
            if [[ -s artifacts/p1_4/c3/historical_evaluation/C3_HISTORICAL_BREAK_EVALUATION_V1_AR.md ]]; then
              cat artifacts/p1_4/c3/historical_evaluation/C3_HISTORICAL_BREAK_EVALUATION_V1_AR.md
            else
              echo "C3 evaluation report unavailable; inspect the detector job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload C3 historical evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p1-4-c3-historical-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p1_4/c3/historical_evaluation/
          retention-days: 90
          if-no-files-found: warn
