name: CHAOS P1.4 One-time Capability Contract Verification

on:
  push:
    branches:
      - feat/p1-4-capability-envelope-pilot-v1-20261125
    paths:
      - ".github/workflows/p1-4-capability-gates-once.yml"
      - "tests/governance/test_p1_4_cohort_selection_manifest_binding.py"

permissions:
  contents: read

concurrency:
  group: chaos-p1-4-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile capability runtime
        run: python -m py_compile chaos_governance_kernel/capability_envelope.py p1_4_validation/injection_runner.py
      - name: Install P1.4 injection runtime dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Run P1.4 capability, protocol and injection contract tests
        run: |
          python -m unittest discover -s tests/governance -p 'test_p1_4_capability_envelope.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_pilot_protocol.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_injection_runner.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_cohort_selection_manifest_binding.py' -v
