name: CHAOS P1.4 C2 Frozen Stable-Cohort Pilot

on:
  workflow_dispatch:
    inputs:
      execute_frozen_c2_20:
        description: "Explicitly run the frozen 20-series C2 calibration and pilot"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: chaos-p1-4-c2-stable-pilot
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ inputs.execute_frozen_c2_20 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Require the dedicated C2 implementation branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/p1-4-c2-stable-generalization-v1" || {
            echo "C2 dispatch must select feat/p1-4-c2-stable-generalization-v1; got $GITHUB_REF" >&2
            exit 2
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned C2 runtime
        run: |
          python -m pip install "numpy==1.26.4" "pandas==2.2.3"
          python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Compile and run frozen C2 governance contracts
        run: |
          set -euo pipefail
          python -m py_compile p1_4_validation/run_c2_stable_pilot.py p1_4_validation/run_evidence_pipeline.py p1_4_validation/injection_runner.py
          python -m unittest discover -s tests/governance -p 'test_p1_4_c2_stable_pilot.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_capability_envelope.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_pilot_protocol.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_injection_runner.py' -v
          python -m unittest discover -s tests/governance -p 'test_p1_4_cohort_selection_manifest_binding.py' -v
      - name: Assert protocol, cohort and detector source fingerprints
        run: |
          set -euo pipefail
          test "$(git hash-object p1_4_validation/pilot_protocol.json)" = "2ad0db0654bd1d9dd42c87c5cdb531f9b2aa3a2d"
          test "$(git hash-object p1_4_validation/cohort_manifest.json)" = "2a9ca14b501567f06840d047597d3a24398c31f2"
          test "$(git hash-object p2_b_benchmark/p2c_engine.py)" = "5efcf408822551e00cb87c24e39502dcf0ed595a"
      - name: Download and SHA-verify frozen C2 source inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen-inputs/p2-g1-shards /tmp/c2-downloads
          fetch_artifact() {
            local artifact_id="$1" digest="$2" output="$3"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o "$output"
            echo "$digest  $output" | sha256sum --check
          }
          fetch_artifact 14857826243 c83f6e960296fbbdb687650a798959f08cb8d98db68de8ca713d7be278e824fe /tmp/c2-downloads/p2-prepared.zip
          fetch_artifact 14995009654 fa67b9c79e5867a0d799c981903e3a44b9b7b680bb2a844a25dfd2a91bf31e0b /tmp/c2-downloads/cohort-selection.zip
          unzip -p /tmp/c2-downloads/cohort-selection.zip cohort_selection.json > frozen-inputs/cohort_selection.json
          echo "9ad27e0c78e3d851ec9f2c02828eadc15567f84fc1ed8f467588bb7d4f42288b  frozen-inputs/cohort_selection.json" | sha256sum --check
          fetch_artifact 14861808748 6cf04825de2a5e7f6b30f03aad97426fa0392038e84764ee68b52e2f70d5f89c /tmp/c2-downloads/g1-0.zip
          fetch_artifact 14861805478 6f617b240c3c35d68f0295a9e21ebf07e797ff72d3566b984b764491b925c886 /tmp/c2-downloads/g1-1.zip
          fetch_artifact 14862282819 881c40e34838329c1b809257d9c729c56e5304ab20b015bf8b98f656075586d4 /tmp/c2-downloads/g1-2.zip
          fetch_artifact 14860330825 6996d69724f01b1be7ba1660ecc1572e4432802f1aebc21d521e22b58e5a35df /tmp/c2-downloads/g1-3.zip
          cp /tmp/c2-downloads/p2-prepared.zip frozen-inputs/p2-prepared.zip
          for i in 0 1 2 3; do
            unzip -p "/tmp/c2-downloads/g1-$i.zip" "shard-$i.json" > "frozen-inputs/p2-g1-shards/shard-$i.json"
          done
          python - <<'PY'
          import json
          d=json.load(open("frozen-inputs/cohort_selection.json", encoding="utf-8"))
          ids=sorted(x["series_id"] for x in d["c2"]["pilot_series"])
          assert len(ids)==20 and len(set(ids))==20, ids
          print("Frozen C2 pilot IDs verified:", len(ids))
          PY
      - name: Upload frozen input package for matrix reuse
        uses: actions/upload-artifact@v4
        with:
          name: p1-4-c2-frozen-inputs-${{ github.run_id }}
          path: frozen-inputs/
          retention-days: 7
          if-no-files-found: error

  calibrate:
    if: ${{ inputs.execute_frozen_c2_20 == true }}
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {series_id: "gem:CPTOTSAXN:DEU", series_key: "GEM-CPTOTSAXN-DEU"}
          - {series_id: "gem:CPTOTSAXN:IRL", series_key: "GEM-CPTOTSAXN-IRL"}
          - {series_id: "gem:DXGSRMRCHNSKD:BRA", series_key: "GEM-DXGSRMRCHNSKD-BRA"}
          - {series_id: "gem:DXGSRMRCHNSKD:DEV", series_key: "GEM-DXGSRMRCHNSKD-DEV"}
          - {series_id: "gem:DXGSRMRCHNSKD:GRC", series_key: "GEM-DXGSRMRCHNSKD-GRC"}
          - {series_id: "gem:DXGSRMRCHNSKD:HIY", series_key: "GEM-DXGSRMRCHNSKD-HIY"}
          - {series_id: "gem:DXGSRMRCHNSKD:LAP", series_key: "GEM-DXGSRMRCHNSKD-LAP"}
          - {series_id: "gem:DXGSRMRCHSAXD:AME", series_key: "GEM-DXGSRMRCHSAXD-AME"}
          - {series_id: "gem:DXGSRMRCHSAXD:FIN", series_key: "GEM-DXGSRMRCHSAXD-FIN"}
          - {series_id: "gem:DXGSRMRCHSAXD:LAP", series_key: "GEM-DXGSRMRCHSAXD-LAP"}
          - {series_id: "gem:IPTOTSAKD:AZE", series_key: "GEM-IPTOTSAKD-AZE"}
          - {series_id: "gem:IPTOTSAKD:EST", series_key: "GEM-IPTOTSAKD-EST"}
          - {series_id: "gem:IPTOTSAKD:IRQ", series_key: "GEM-IPTOTSAKD-IRQ"}
          - {series_id: "gem:IPTOTSAKD:OMN", series_key: "GEM-IPTOTSAKD-OMN"}
          - {series_id: "gem:IPTOTSAKD:SVN", series_key: "GEM-IPTOTSAKD-SVN"}
          - {series_id: "gem:IPTOTSAKD:TUN", series_key: "GEM-IPTOTSAKD-TUN"}
          - {series_id: "gem:IPTOTSAKD:VNM", series_key: "GEM-IPTOTSAKD-VNM"}
          - {series_id: "pink:DAP", series_key: "PINK-DAP"}
          - {series_id: "pink:Fish_meal", series_key: "PINK-FISH-MEAL"}
          - {series_id: "pink:Soybean_oil", series_key: "PINK-SOYBEAN-OIL"}
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned C2 runtime
        run: |
          python -m pip install "numpy==1.26.4" "pandas==2.2.3"
          python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Download frozen source inputs
        uses: actions/download-artifact@v4
        with:
          name: p1-4-c2-frozen-inputs-${{ github.run_id }}
          path: frozen-inputs
      - name: Calibrate exact frozen C2 series (1000 development + 1000 holdout per position)
        run: |
          set -euo pipefail
          python p1_4_validation/run_c2_stable_pilot.py \
            --phase calibrate \
            --series-id "${{ matrix.series_id }}" \
            --prepared-zip frozen-inputs/p2-prepared.zip \
            --manifest p1_4_validation/cohort_manifest.json \
            --protocol p1_4_validation/pilot_protocol.json \
            --selection-json frozen-inputs/cohort_selection.json \
            --g1-shards-dir frozen-inputs/p2-g1-shards \
            --output "artifacts/p1_4/c2/calibration/${{ matrix.series_key }}" \
            --budget-hours 5.5
      - name: Upload this exact C2 calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-4-c2-calibration-${{ matrix.series_key }}-${{ github.run_id }}
          path: artifacts/p1_4/c2/calibration/${{ matrix.series_key }}/
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    if: ${{ always() && inputs.execute_frozen_c2_20 == true && needs.preflight.result == 'success' && needs.calibrate.result == 'success' }}
    needs: [preflight, calibrate]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned C2 runtime
        run: |
          python -m pip install "numpy==1.26.4" "pandas==2.2.3"
          python -m pip install -r real_data_stress_pipeline/requirements.txt
      - name: Download frozen C2 inputs
        uses: actions/download-artifact@v4
        with:
          name: p1-4-c2-frozen-inputs-${{ github.run_id }}
          path: frozen-inputs
      - name: Download all 20 per-series C2 calibration artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p1-4-c2-calibration-*-${{ github.run_id }}
          path: artifacts/p1_4/c2/calibration
          merge-multiple: false
      - name: Recompute Holdout gates and execute the C2 injection pilot
        run: |
          set -euo pipefail
          python p1_4_validation/run_c2_stable_pilot.py \
            --phase postprocess \
            --prepared-zip frozen-inputs/p2-prepared.zip \
            --manifest p1_4_validation/cohort_manifest.json \
            --protocol p1_4_validation/pilot_protocol.json \
            --selection-json frozen-inputs/cohort_selection.json \
            --g1-shards-dir frozen-inputs/p2-g1-shards \
            --calibration-dir artifacts/p1_4/c2/calibration \
            --output artifacts/p1_4/c2/evidence
      - name: Upload C2 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p1-4-c2-stable-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p1_4/c2/evidence/
          retention-days: 90
          if-no-files-found: warn
