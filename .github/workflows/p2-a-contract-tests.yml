name: CHAOS P2-A — Provenance Contract Tests

on:
  pull_request:
    branches: [main-phase2]
    paths:
      - 'scripts/audits/p2_a_usgs_magnitude_provenance.py'
      - 'tests/audits/test_p2_a_usgs_magnitude_provenance.py'
      - 'real_data_stress_pipeline/contracts/p2_a_magnitude_provenance_recovery_v1.json'
      - 'real_data_stress_pipeline/run_pipeline.py'
      - 'real_data_stress_pipeline/config/*.json'
      - '.github/workflows/p2-a-*.yml'

permissions:
  contents: read

jobs:
  p2-a-provenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r real_data_stress_pipeline/requirements.txt
      - run: python -m unittest discover -s tests/audits -p 'test_p2_a_usgs_magnitude_provenance.py' -v
