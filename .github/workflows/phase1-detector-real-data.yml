name: Phase 1 Freeze and Real Historical Data Scan

on:
  push:
    branches:
      - phase1-detector-freeze-phase2-real-data
    paths:
      - 'structural_engine/isolated_break_detector_v1/**'
      - 'data/raw/**'
      - '.github/workflows/phase1-detector-real-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-detector-freeze-phase2-real-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Run detector contract tests
        run: python -m unittest discover -s structural_engine/isolated_break_detector_v1/tests -v
      - name: Scan committed real historical data
        run: python structural_engine/isolated_break_detector_v1/run_real_data.py
      - name: Record frozen source checksums
        run: |
          mkdir -p structural_engine/isolated_break_detector_v1/results
          sha256sum structural_engine/isolated_break_detector_v1/*.py > structural_engine/isolated_break_detector_v1/results/SHA256SUMS.txt
          sha256sum data/raw/seismic_gulf_of_aden_v1/usgs_gulf_of_aden_query.geojson data/raw/usgs_earthquake_m6_5_2000_2024/USGS_EARTHQUAKE_M6_5_2000_2024_RAW.csv data/raw/financial_world_bank_v1/WB_FS_AST_PRVT_GD_ZS_2000_2024.csv >> structural_engine/isolated_break_detector_v1/results/SHA256SUMS.txt
      - name: Upload reproducible report and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-freeze-real-data-scan
          path: |
            structural_engine/isolated_break_detector_v1/results/
          if-no-files-found: warn
