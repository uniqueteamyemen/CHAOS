name: P-engine robustness holdout

on:
  push:
    branches:
      - experiment/p-engine-parallel-fusion-v7
    paths:
      - "experiments/identity_lab/exp_p_engine/engine.py"
      - "experiments/identity_lab/exp_p_engine/parallel_fusion.py"
      - "experiments/identity_lab/exp_p_engine/benchmark_parallel_fusion.py"
      - "experiments/identity_lab/exp_p_engine/benchmark_robustness.py"
      - "experiments/identity_lab/exp_p_engine/test_robustness.py"
      - "experiments/identity_lab/exp_p_engine/test_parallel_fusion.py"
      - ".github/workflows/p-engine-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test robustness noise generators and paired-seed contract
        run: python -m unittest experiments.identity_lab.exp_p_engine.test_robustness -v
      - name: Run 300-seed A/G/H/J/I robustness holdout
        run: python -m experiments.identity_lab.exp_p_engine.benchmark_robustness
      - name: Upload robustness holdout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-p-engine-robustness-holdout
          path: experiments/identity_lab/exp_p_engine/results/parallel_fusion_robustness_300_seed.json
          if-no-files-found: warn
