name: CHAOS P2-A — USGS Magnitude Provenance Recovery

on:
  push:
    branches: [feat/p2-a-usgs-mag-source-recovery-v1]
    paths:
      - 'scripts/audits/p2_a_usgs_magnitude_provenance.py'
      - '.github/workflows/p2-a-usgs-magnitude-provenance.yml'
      - 'real_data_stress_pipeline/contracts/p2_a_magnitude_provenance_recovery_v1.json'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing P2.2.3 source-artifact workflow run ID
        required: true
        default: '45244943216'
      source_run_attempt:
        description: Source workflow run attempt containing the immutable artifact
        required: true
        default: '1'

permissions:
  actions: read
  contents: read

concurrency:
  group: chaos-p2-a-mag-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-magnitude-source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '45244943216' }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt || '1' }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact P2-A implementation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download immutable P2.2.3 source artifact
        uses: actions/download-artifact@v8
        with:
          digest-mismatch: error
          name: chaos-p2-domain-null-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/p2_a/source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: real_data_stress_pipeline/requirements.txt

      - name: Install audit dependencies
        run: python -m pip install -r real_data_stress_pipeline/requirements.txt

      - name: Recover preferred magnitude source and reconcile
        run: python -u scripts/audits/p2_a_usgs_magnitude_provenance.py --source-root artifacts/p2_a/source --output-dir artifacts/p2_a/magnitude_provenance --ledger-path governance/ledger/RESEARCH_LEDGER_V1.jsonl --source-run-id "${{ env.SOURCE_RUN_ID }}" --source-run-attempt "${{ env.SOURCE_RUN_ATTEMPT }}"

      - name: Upload P2-A provenance and Research Ledger evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-p2-a-mag-source-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            artifacts/p2_a/magnitude_provenance/
            governance/ledger/RESEARCH_LEDGER_V1.jsonl
